<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>ApexLedger AI - Hybrid AI Accounting & Tax Preparation</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel for Instant In-Browser Execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin="anonymous"></script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; }
    code, pre, .font-mono { font-family: 'JetBrains Mono', monospace; }
    @media print {
      body { background: #ffffff !important; color: #000000 !important; margin: 0 !important; padding: 0 !important; }
      nav, header, button, .no-print { display: none !important; }
      body * { visibility: hidden; }
      .print-area, .print-area * { visibility: visible; }
      .print-area { position: absolute !important; left: 0 !important; top: 0 !important; width: 100% !important; margin: 0 !important; padding: 15px !important; background: #ffffff !important; color: #000000 !important; }
      .print-area table { border-collapse: collapse !important; width: 100% !important; font-size: 11px !important; }
      .print-area th, .print-area td { border: 1px solid #cbd5e1 !important; padding: 5px 8px !important; color: #000000 !important; }
      .print-area thead { background: #f8fafc !important; color: #000000 !important; }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-indigo-500 selection:text-white">
  <div id="root"></div>

  <script>
    window.onerror = function(msg, url, line, col, error) {
      var el = document.getElementById('fatal-error-overlay');
      if (!el) {
        el = document.createElement('div');
        el.id = 'fatal-error-overlay';
        el.style = "position:fixed;top:0;left:0;right:0;bottom:0;background:#1e1b4b;color:white;padding:30px;z-index:999999;font-family:sans-serif;font-size:14px;overflow:auto;";
        el.innerHTML = "<h2 style='font-size:20px;font-weight:bold;margin-bottom:12px;color:#f87171;'>⚠️ Runtime Script Error</h2><pre id='fatal-err-content' style='background:#0f172a;color:#cbd5e1;padding:16px;border-radius:8px;font-family:monospace;white-space:pre-wrap;'></pre>";
        document.body.appendChild(el);
      }
      document.getElementById('fatal-err-content').innerText += "ERROR: " + msg + "\nAt: " + url + ":" + line + ":" + col + "\n" + (error && error.stack ? error.stack : "") + "\n\n";
    };

    var origError = console.error;
    console.error = function() {
      origError.apply(console, arguments);
      var msg = Array.from(arguments).map(function(a) {
        return (a && a.stack) ? a.stack : String(a);
      }).join(' ');
      var el = document.getElementById('fatal-error-overlay');
      if (!el) {
        el = document.createElement('div');
        el.id = 'fatal-error-overlay';
        el.style = "position:fixed;top:0;left:0;right:0;bottom:0;background:#1e1b4b;color:white;padding:30px;z-index:999999;font-family:sans-serif;font-size:14px;overflow:auto;";
        el.innerHTML = "<h2 style='font-size:20px;font-weight:bold;margin-bottom:12px;color:#f87171;'>⚠️ Console Error Captured</h2><pre id='fatal-err-content' style='background:#0f172a;color:#cbd5e1;padding:16px;border-radius:8px;font-family:monospace;white-space:pre-wrap;'></pre>";
        document.body.appendChild(el);
      }
      document.getElementById('fatal-err-content').innerText += msg + "\n\n";
    };
  </script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const getApiBase = () => {
      const path = window.location.pathname;
      if (path.includes('/accounting')) {
        return '/accounting/api';
      }
      return '/api';
    };

    const API_BASE = getApiBase();

    // ========================================================================
    // COMPONENT: TransactionEntry (Module 3)
    // ========================================================================
    function TransactionEntry({ token, onTransactionSaved, onUpgradeRequired }) {
      const [inputText, setInputText] = useState('');
      const [isProcessing, setIsProcessing] = useState(false);
      const [error, setError] = useState(null);
      const [successMessage, setSuccessMessage] = useState(null);

      const [parsedData, setParsedData] = useState(null);
      const [selectedOption, setSelectedOption] = useState('');
      const [targetAccountInfo, setTargetAccountInfo] = useState(null);
      const [customDescription, setCustomDescription] = useState('');
      const [gstRate, setGstRate] = useState('18');
      const [isInterstate, setIsInterstate] = useState(false);
      const [gstOff, setGstOff] = useState(false);
      const [isSubmittingFinal, setIsSubmittingFinal] = useState(false);
      const [availableAccounts, setAvailableAccounts] = useState([]);
      const [recentEntries, setRecentEntries] = useState([]);
      const [deletingId, setDeletingId] = useState(null);

      // Single-Prompt Compound Understanding & Auto-Post State
      const [compoundData, setCompoundData] = useState(null);
      const [isAutoPosting, setIsAutoPosting] = useState(false);
      const [isUnderstanding, setIsUnderstanding] = useState(false);
      const [lastVoucher, setLastVoucher] = useState(null);

      // Corporate Case Study Deliverables State
      const [caseStudyData, setCaseStudyData] = useState(null);
      const [caseStudyTab, setCaseStudyTab] = useState('vouchers');
      const [isPostingCaseStudy, setIsPostingCaseStudy] = useState(false);
      const [showGrossBs, setShowGrossBs] = useState(false);

      // Instant Account Creation State
      const [showCreateModal, setShowCreateModal] = useState(false);
      const [newAccountName, setNewAccountName] = useState('');
      const [newAccountType, setNewAccountType] = useState('revenue');
      const [newAccountGst, setNewAccountGst] = useState(true);
      const [isCreatingAccount, setIsCreatingAccount] = useState(false);

      const fetchRecentEntries = async () => {
        try {
          const res = await fetch(`${API_BASE}/transactions`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          const json = await res.json();
          if (json.success) {
            setRecentEntries((json.data || []).slice(0, 5));
          }
        } catch (e) {}
      };

      useEffect(() => {
        if (token) fetchRecentEntries();
      }, [token]);

      const handleDeleteRecent = async (txId, accName, amt) => {
        if (!window.confirm(`Are you sure you want to delete transaction #${txId} (${accName} - ₹${amt}) from accounts?\n\nNote: All balanced ledger postings based on this entry (e.g. Bank Outflow/Inflow) will also be removed.`)) {
          return;
        }
        setDeletingId(txId);
        setError(null);
        setSuccessMessage(null);
        try {
          const res = await fetch(`${API_BASE}/transactions/${txId}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
          });
          const data = await res.json();
          if (!res.ok || !data.success) {
            throw new Error(data.error || 'Failed to delete transaction.');
          }
          setSuccessMessage(`✓ ${data.message || `Transaction #${txId} successfully deleted from accounts.`}`);
          await fetchRecentEntries();
          if (onTransactionSaved) onTransactionSaved();
        } catch (err) {
          setError(err.message);
        } finally {
          setDeletingId(null);
        }
      };

      const handleCreateAccount = async (e) => {
        if (e) e.preventDefault();
        const trimmed = newAccountName.trim();
        if (!trimmed) {
          setError('Account name is required.');
          return;
        }
        setIsCreatingAccount(true);
        setError(null);
        try {
          const res = await fetch(`${API_BASE}/accounts`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({
              name: trimmed,
              type: newAccountType,
              gst_applicable: newAccountGst ? 1 : 0
            })
          });
          const data = await res.json();
          if (!res.ok || !data.success) {
            throw new Error(data.error || 'Failed to create target account.');
          }
          const createdAcc = data.account;
          setAvailableAccounts(prev => {
            if (!prev.some(a => String(a.id) === String(createdAcc.id) || a.name.toLowerCase() === createdAcc.name.toLowerCase())) {
              return [createdAcc, ...prev];
            }
            return prev;
          });
          setSelectedOption(createdAcc.name);
          setTargetAccountInfo(createdAcc);
          setShowCreateModal(false);
          setNewAccountName('');
          setSuccessMessage(`✓ Target Account '${createdAcc.name}' (${createdAcc.code}) created instantly & selected.`);
        } catch (err) {
          setError(err.message);
        } finally {
          setIsCreatingAccount(false);
        }
      };

      const techflowCaseStudyPrompt = `TechFlow Solutions
TechFlow Solutions commenced business on April 1, 2025. All transactions attract an 18% GST (9% CGST + 9% SGST) where applicable. During April 2025, the following transactions occurred:

Apr 1: The owner invested ₹500,000 cash into the business.

Apr 5: Purchased office equipment for ₹100,000 + 18% GST. Paid in full via bank.

Apr 10: Purchased inventory (goods for resale) for ₹50,000 + 18% GST on credit from ABC Corp.

Apr 15: Sold goods for ₹80,000 + 18% GST. The customer paid cash immediately.

Apr 25: Paid monthly office rent of ₹10,000 in cash (Assume no GST on this rent).

Apr 28: Paid ABC Corp ₹30,000 in cash towards the outstanding payable.

Apr 30: A physical count shows ₹10,000 worth of closing inventory remains.

Your Task: Prepare the Trial Balance, Statement of Profit & Loss, Balance Sheet, Cash Flow Statement, and a GST Summary for April.`;

      const samplePrompts = [
        'Sold consulting services to Reliance for 1 lakh + 18% GST, received 50k in HDFC Bank and balance receivable',
        'Paid office rent 50000 on 2026-09-01 via Bank with 10% TDS deduction to landlord Sharma Properties',
        'Paid 6000 rs for 12 month network recharge using bank',
        'Purchased 3 Dell Laptops for 1.5 lakhs and printer 20k with 18% GST paid by Bank',
        'Paid employee salary 1,20,000: basic 1,20,000, PF 14,400, TDS 6,000, net paid 99,600 via Bank'
      ];

      const handleAutoPost = async (e) => {
        if (e) e.preventDefault();
        const text = inputText.trim();
        if (!text) return;

        setIsAutoPosting(true);
        setError(null);
        setSuccessMessage(null);
        setParsedData(null);
        setCompoundData(null);
        setLastVoucher(null);

        try {
          const res = await fetch(`${API_BASE}/ai/auto-post`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ prompt: text, is_interstate: isInterstate, gst_off: gstOff })
          });

          const data = await res.json();
          if (!res.ok || !data.success) {
            if (data.upgrade_required && onUpgradeRequired) {
              onUpgradeRequired(data.error);
              return;
            }
            throw new Error(data.error || 'Failed to auto-post transaction.');
          }

          if (data.is_case_study) {
            setCaseStudyData({ ...data, prompt: text });
            setCompoundData(null);
            setLastVoucher(null);
            setInputText('');
            const grpId = data.posting_details?.case_study_group_id || 'CS_POSTED';
            setSuccessMessage(`⚡ Case Study solved & posted! 7 vouchers under group ${grpId}`);
          } else {
            setLastVoucher(data);
            setInputText('');
            const postedCount = data.posting_details?.entries_posted || (data.entries?.length || 0);
            const grpId = data.posting_details?.entry_group_id || 'N/A';
            setSuccessMessage(`⚡ All ${postedCount} entries verified & posted to accounts books! (Voucher ID: ${grpId})`);
          }
          await fetchRecentEntries();
          if (onTransactionSaved) onTransactionSaved();
        } catch (err) {
          setError(err.message);
        } finally {
          setIsAutoPosting(false);
        }
      };

      const handleUnderstand = async (e) => {
        if (e) e.preventDefault();
        const text = inputText.trim();
        if (!text) return;

        setIsUnderstanding(true);
        setError(null);
        setSuccessMessage(null);
        setParsedData(null);
        setCompoundData(null);
        setLastVoucher(null);

        try {
          const res = await fetch(`${API_BASE}/ai/understand`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ prompt: text, is_interstate: isInterstate, gst_off: gstOff })
          });

          const data = await res.json();
          if (!res.ok || !data.success) {
            throw new Error(data.error || 'Failed to analyze transaction details.');
          }

          if (data.is_case_study) {
            setCaseStudyData({ ...data, prompt: text });
            setCompoundData(null);
            setSuccessMessage(`✓ Case Study solved: ${data.company_name} (${data.period}) — 5 financial statements generated. Review the tabs below, then post to books.`);
          } else {
            setCompoundData(data);
            setCaseStudyData(null);
          }
        } catch (err) {
          setError(err.message);
        } finally {
          setIsUnderstanding(false);
        }
      };

      const handlePostCompoundEntries = async () => {
        if (!compoundData || !compoundData.entries || compoundData.entries.length === 0) return;

        setIsSubmittingFinal(true);
        setError(null);

        try {
          const res = await fetch(`${API_BASE}/transactions`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({
              entries: compoundData.entries,
              raw_ai_input: compoundData.prompt || inputText,
              date: compoundData.date || new Date().toISOString().split('T')[0],
              description: compoundData.narration || 'Compound Journal Voucher'
            })
          });

          const data = await res.json();
          if (!res.ok || !data.success) {
            throw new Error(data.error || 'Failed to post compound entries.');
          }

          setLastVoucher({
            prompt: compoundData.prompt,
            date: compoundData.date,
            narration: compoundData.narration,
            entries: compoundData.entries,
            verification: compoundData.verification,
            new_accounts_setup: compoundData.new_accounts_setup,
            posting_details: {
              entry_group_id: data.entry_group_id,
              entries_posted: data.entries?.length || compoundData.entries.length,
              entries: data.entries || compoundData.entries
            }
          });

          const count = data.entries?.length || compoundData.entries.length;
          setSuccessMessage(`✓ All ${count} entries verified & posted to accounts books!`);
          setCompoundData(null);
          setInputText('');
          await fetchRecentEntries();
          if (onTransactionSaved) onTransactionSaved();
        } catch (err) {
          setError(err.message);
        } finally {
          setIsSubmittingFinal(false);
        }
      };

      const handlePostCaseStudy = async () => {
        if (!caseStudyData) return;
        setIsPostingCaseStudy(true);
        setError(null);
        try {
          const res = await fetch(`${API_BASE}/ai/case-study/post`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ prompt: caseStudyData.prompt || techflowCaseStudyPrompt })
          });
          const data = await res.json();
          if (!res.ok || !data.success) {
            throw new Error(data.error || 'Failed to post case study vouchers.');
          }
          setCaseStudyData({ ...data, prompt: caseStudyData.prompt });
          const count = data.posting_details?.entries_posted || 20;
          const grpId = data.posting_details?.case_study_group_id || 'CS_POSTED';
          setSuccessMessage(`✓ All 7 vouchers (${count} legs) posted to accounts books! Group: ${grpId}`);
          await fetchRecentEntries();
          if (onTransactionSaved) onTransactionSaved();
        } catch (err) {
          setError(err.message);
        } finally {
          setIsPostingCaseStudy(false);
        }
      };

      const handleParse = async (e) => {
        if (e) e.preventDefault();
        if (!inputText.trim()) return;

        setIsProcessing(true);
        setError(null);
        setSuccessMessage(null);
        setParsedData(null);
        setSelectedOption('');
        setTargetAccountInfo(null);

        try {
          const res = await fetch(`${API_BASE}/ai/parse`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ text: inputText.trim() })
          });

          const data = await res.json();
          if (!res.ok || !data.success) {
            throw new Error(data.error || 'Failed to parse financial text.');
          }

          const ai = data.data;
          setParsedData(ai);
          setCustomDescription(inputText.trim());

          if (data.all_accounts && Array.isArray(data.all_accounts)) {
            setAvailableAccounts(data.all_accounts);
          }

          // Auto-pick Target Account
          const target = data.target_account || null;
          setTargetAccountInfo(target);

          let initialOption = '';
          if (target && target.name) {
            initialOption = target.name;
          } else if (ai.suggested_account_name) {
            initialOption = ai.suggested_account_name;
          } else if (ai.review_options && ai.review_options.length > 0) {
            initialOption = ai.review_options[0];
          } else if (ai.transaction_type === 'credit') {
            initialOption = 'Software Development Services';
          } else {
            initialOption = 'Office Expense';
          }
          setSelectedOption(initialOption);

          // If target was auto-created, notify the user
          if (target && target.auto_created) {
            setSuccessMessage(`✓ Auto-detected & instantly created target account: ${target.name} (${target.code})`);
          }

          if (ai.gst_extracted > 0 && ai.parsed_amount > 0) {
            const calculatedRate = Math.round((ai.gst_extracted / ai.parsed_amount) * 100);
            setGstRate(String(calculatedRate));
          }
        } catch (err) {
          setError(err.message);
        } finally {
          setIsProcessing(false);
        }
      };

      const handleFinalSubmit = async () => {
        if (!parsedData) return;
        if (parsedData.needs_user_review && !selectedOption) {
          setError('Please resolve the accounting ambiguity before submitting.');
          return;
        }

        setIsSubmittingFinal(true);
        setError(null);

        try {
          const amount = Number(parsedData.parsed_amount);
          const rate = Number(gstRate) || 0;
          const gstAmount = rate > 0 ? Number(((amount * rate) / 100).toFixed(2)) : 0;

          // Ensure a valid non-empty account is always passed
          let finalAccount = selectedOption;
          if (!finalAccount) {
            if (parsedData.review_options && parsedData.review_options.length > 0) {
              finalAccount = parsedData.review_options[0];
            } else if (parsedData.suggested_account_name) {
              finalAccount = parsedData.suggested_account_name;
            } else {
              const cat = (parsedData.suggested_category || '').toLowerCase();
              if (cat.includes('util') || cat.includes('telecom') || cat.includes('network') || cat.includes('recharg')) {
                finalAccount = 'Utility Bills';
              } else if (parsedData.transaction_type === 'credit') {
                finalAccount = 'Consulting Income';
              } else {
                finalAccount = 'Office Expense';
              }
            }
          }

          const payload = {
            amount: amount,
            type: parsedData.transaction_type,
            account_name: finalAccount,
            date: new Date().toISOString().split('T')[0],
            description: customDescription || finalAccount,
            gst_amount: gstAmount,
            gst_rate: rate,
            is_interstate: isInterstate,
            raw_ai_input: inputText
          };

          const res = await fetch(`${API_BASE}/transactions`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify(payload)
          });

          const data = await res.json();
          if (!res.ok || !data.success) {
            if (data.upgrade_required && onUpgradeRequired) {
              onUpgradeRequired(data.error);
              return;
            }
            throw new Error(data.error || 'Failed to save transaction.');
          }

          setSuccessMessage(
            `Transaction #${data.transaction.id} saved & trained into AI dataset! Account: ${data.transaction.account_name} (₹${Number(data.transaction.amount).toLocaleString('en-IN')}) | Tax: CGST ₹${data.transaction.cgst}, SGST ₹${data.transaction.sgst}, IGST ₹${data.transaction.igst}`
          );

          setInputText('');
          setParsedData(null);
          setSelectedOption('');

          await fetchRecentEntries();
          if (onTransactionSaved) onTransactionSaved();
        } catch (err) {
          setError(err.message);
        } finally {
          setIsSubmittingFinal(false);
        }
      };

      return (
        <div className="w-full bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-6 sm:p-8 space-y-6">
          <div className="flex items-center justify-between pb-4 border-b border-slate-800">
            <div>
              <h2 className="text-xl sm:text-2xl font-extrabold bg-gradient-to-r from-blue-400 via-indigo-300 to-purple-400 bg-clip-text text-transparent">
                AI Natural Language Ingestion & Disambiguation
              </h2>
              <p className="text-xs sm:text-sm text-slate-400 mt-1">
                Enter transactions in colloquial terms (e.g., lakh, k, crore). Ambiguities trigger Human-in-the-Loop review.
              </p>
            </div>
            <span className="hidden sm:inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
              <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
              AI Self-Learning Engine Active
            </span>
          </div>

          <div className="flex flex-wrap items-center gap-2">
            <span className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Examples:</span>
            {samplePrompts.map((p, i) => (
              <button
                key={i}
                type="button"
                onClick={() => setInputText(p)}
                className="text-xs bg-slate-800 hover:bg-slate-750 text-slate-300 hover:text-white px-3 py-1.5 rounded-lg border border-slate-700 transition"
              >
                "{p}"
              </button>
            ))}
          </div>

          <form onSubmit={handleAutoPost} className="space-y-3">
            <div className="relative">
              <textarea
                rows="3"
                value={inputText}
                onChange={(e) => setInputText(e.target.value)}
                placeholder='Enter single prompt with all details (e.g., "Sold consulting services to Reliance for 1 lakh + 18% GST on 2026-09-10, received 50k in HDFC Bank and balance receivable" or "Paid office rent 50000 with 10% TDS deduction via Bank on 2026-09-01")'
                className="w-full bg-slate-950 border border-slate-700 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-500 text-sm sm:text-base outline-none transition"
                disabled={isProcessing || isAutoPosting || isUnderstanding}
              />
            </div>

            <div className="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 bg-slate-950/60 p-3 rounded-xl border border-slate-800">
              <div className="flex flex-wrap items-center gap-3">
                <label className="inline-flex items-center gap-2 text-xs text-slate-400 cursor-pointer select-none">
                  <input
                    type="checkbox"
                    checked={isInterstate}
                    onChange={(e) => setIsInterstate(e.target.checked)}
                    className="w-4 h-4 rounded text-indigo-600 bg-slate-900 border-slate-700 focus:ring-0"
                  />
                  <span>Interstate Supply (IGST)</span>
                </label>
                <button

      const sampleQueries = [
        'I bought a Macbook for 1 lakh on August 25, what is the depreciation?',
        'Calculate depreciation on 2 lakhs of office furniture and chairs',
        'Commercial delivery vehicle purchased for 8 lakhs in November',
        'Server and network hardware 3.5 lakhs'
      ];

      const handleResolveDepreciation = async (e) => {
        if (e) e.preventDefault();
        if (!promptText.trim()) return;

        setIsResolving(true);
        setError(null);
        setSuccessMsg(null);
        setDeprResult(null);

        try {
          const res = await fetch(`${API_BASE}/ai/depreciation`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ prompt: promptText.trim() })
          });
          const json = await res.json();
          if (!res.ok || !json.success) {
            throw new Error(json.error || 'Failed to calculate statutory depreciation.');
          }
          setDeprResult(json);
        } catch (err) {
          setError(err.message);
        } finally {
          setIsResolving(false);
        }
      };

      const handlePostJournalEntry = async () => {
        if (!deprResult || !deprResult.suggested_journal_entry) return;

        setIsPostingEntry(true);
        setError(null);

          const entry = deprResult.suggested_journal_entry;
          const res = await fetch(`${API_BASE}/transactions/depreciation`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({
              amount: entry.amount,
              date: new Date().toISOString().split('T')[0],
              description: entry.narration,
              raw_prompt: promptText
            })
          });
          const json = await res.json();
          if (!res.ok || !json.success) {
            throw new Error(json.error || 'Failed to post depreciation entry.');
          }
          setSuccessMsg(`Depreciation entry posted to ledger: ₹${Number(entry.amount).toLocaleString('en-IN')} (Debit: Depreciation Expense, Credit: Accumulated Depreciation)`);

          setError(err.message);
        } finally {
          setIsPostingEntry(false);

        <div className="w-full bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-6 sm:p-8 space-y-6">

              <p className="text-xs sm:text-sm text-slate-400 mt-1">

            <span className="px-3 py-1 rounded-full text-xs font-semibold bg-cyan-500/10 text-cyan-400 border border-cyan-500/20">

          </div>

          {/* Sample Prompts */}
          <div className="flex flex-wrap items-center gap-2">
            <span className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Try:</span>
            {sampleQueries.map((q, i) => (

              >
                "{q}"
              </button>
            ))}
          </div>

          {/* Form */}
          <form onSubmit={handleResolveDepreciation} className="relative">
            <textarea
              rows="2"
              value={promptText}
              onChange={(e) => setPromptText(e.target.value)}
              placeholder='e.g., "I bought a Macbook for 1 lakh on August 25, what is the depreciation?" or "How much can I write off for 2 lakhs furniture?"'
              className="w-full bg-slate-950 border border-slate-700 focus:border-cyan-500 focus:ring-2 focus:ring-cyan-500/20 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-500 text-sm sm:text-base outline-none transition"
              disabled={isResolving}
            />
            <div className="absolute right-3 bottom-3">
              <button
                type="submit"
                disabled={isResolving || !promptText.trim()}
                className="inline-flex items-center gap-2 bg-gradient-to-r from-teal-500 to-cyan-600 hover:from-teal-600 hover:to-cyan-700 disabled:opacity-50 text-white text-xs sm:text-sm font-semibold px-4 py-2 rounded-lg shadow-lg shadow-cyan-500/25 transition"
              >
                {isResolving ? 'Calculating...' : 'Solve Depreciation'}
              </button>
            </div>
          </form>

          {error && <div className="p-3 bg-rose-950/40 border border-rose-500/40 text-rose-300 rounded-xl text-xs">{error}</div>}
          {successMsg && <div className="p-3 bg-emerald-950/40 border border-emerald-500/40 text-emerald-300 rounded-xl text-xs font-medium">✓ {successMsg}</div>}

          {/* Result Card */}
          {deprResult && (

              {/* Asset Header */}
              <div className="flex flex-wrap items-center justify-between gap-4 p-4 rounded-xl bg-slate-900 border border-slate-800">
                <div>
                  <div className="text-[11px] uppercase text-slate-400">Identified Asset Category</div>
                  <div className="text-lg font-bold text-white">{deprResult.query_parsed.detected_category}</div>
                  <div className="text-xs text-slate-400 font-mono mt-0.5">{deprResult.query_parsed.statutory_block}</div>
                </div>
                <div>
                  <div className="text-[11px] uppercase text-slate-400">Cost Basis</div>
                  <div className="text-2xl font-black text-cyan-400">

                <div className="font-bold flex items-center gap-1.5 mb-1">
                  <span>💡 Statutory Tax Finding:</span>
                </div>
                <p>{deprResult.statutory_note}</p>
              </div>

              {/* Comparison: WDV (Income Tax Act) vs SLM (Companies Act) */}
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {/* Method 1: Income Tax WDV */}

                    <span className="text-xs font-mono bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded font-bold">
                      {deprResult.rates.income_tax_wdv_rate}% Normal Rate
                    </span>
                  </div>
                  <div className="text-xs space-y-1.5 text-slate-300">
                    <div className="flex justify-between">
                      <span>Rate Applied Year 1:</span>
                      <strong className="text-white">{deprResult.depreciation_computations.income_tax_act_wdv.first_year_rate_applied}%</strong>
                    </div>
                    <div className="flex justify-between">
                      <span>Year 1 Tax Write-Off:</span>
                      <strong className="text-emerald-400">₹{Number(deprResult.depreciation_computations.income_tax_act_wdv.year_1_depreciation).toLocaleString('en-IN')}</strong>
                    </div>
                    <div className="flex justify-between">
                      <span>Year 1 Closing Net Book Value:</span>
                      <span>₹{Number(deprResult.depreciation_computations.income_tax_act_wdv.year_1_closing_nbv).toLocaleString('en-IN')}</span>
                    </div>
                    <div className="flex justify-between border-t border-slate-800 pt-1 text-slate-400">
                      <span>Year 2 Write-Off:</span>
                      <span>₹{Number(deprResult.depreciation_computations.income_tax_act_wdv.year_2_depreciation).toLocaleString('en-IN')}</span>
                    </div>
                  </div>
                </div>

                {/* Method 2: Companies Act SLM */}
                <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-3">
                  <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                    <span className="text-xs font-bold uppercase text-blue-400">Companies Act: SLM Method</span>
                    <span className="text-xs font-mono bg-blue-500/20 text-blue-300 px-2 py-0.5 rounded font-bold">
                      {deprResult.rates.companies_act_useful_life_years} Years Useful Life
                    </span>
                  </div>
                  <div className="text-xs space-y-1.5 text-slate-300">
                    <div className="flex justify-between">
                      <span>Annual Straight-Line Rate:</span>
                      <strong className="text-white">{deprResult.rates.companies_act_slm_rate}% / year</strong>
                    </div>
                    <div className="flex justify-between">
                      <span>Annual Depreciation Expense:</span>
                      <strong className="text-blue-400">₹{Number(deprResult.depreciation_computations.companies_act_slm.annual_depreciation).toLocaleString('en-IN')}</strong>
                    </div>
                    <div className="flex justify-between">
                      <span>Monthly Accrual:</span>
                      <span>₹{Number(deprResult.depreciation_computations.companies_act_slm.monthly_depreciation).toLocaleString('en-IN')} / month</span>
                    </div>
                  </div>
                </div>
              </div>

              {/* Journal Entry Proposal & 1-Click Post */}
              <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-3">
                <div className="flex items-center justify-between">
                  <span className="text-xs font-bold uppercase text-slate-400 tracking-wider">Recommended Accounting Journal Entry</span>
                  <span className="text-xs text-indigo-400 font-mono">Balanced Double-Entry</span>
                </div>
                <div className="bg-slate-950 p-3 rounded-lg border border-slate-800 text-xs font-mono space-y-1.5 text-slate-300">
                  <div className="text-emerald-400">
                    Debit: [5070] Depreciation & Amortization Expense &rarr; ₹{Number(deprResult.suggested_journal_entry.amount).toLocaleString('en-IN')}
                  </div>
                  <div className="text-rose-400">
                    Credit: [1590] Accumulated Depreciation - Assets &rarr; ₹{Number(deprResult.suggested_journal_entry.amount).toLocaleString('en-IN')}
                  </div>
                  <div className="text-[11px] text-slate-500 pt-1">
                    Narration: {deprResult.suggested_journal_entry.narration}
                  </div>
                </div>

                <div className="flex justify-end pt-2">
                  <button
                    type="button"
                    onClick={handlePostJournalEntry}
                    disabled={isPostingEntry}
                    className="inline-flex items-center gap-2 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 disabled:opacity-50 text-white font-bold text-xs sm:text-sm px-6 py-2.5 rounded-xl shadow-lg shadow-emerald-500/25 transition"
                  >
                    {isPostingEntry ? 'Posting Entry...' : 'Post Depreciation Journal Entry to Ledger'}
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ========================================================================
    // COMPONENT: ReportsView (Module 4)
    // ========================================================================
    function ReportsView({ token }) {
      const [activeTab, setActiveTab] = useState('pnl');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);

      const [pnlData, setPnlData] = useState(null);
      const [bsData, setBsData] = useState(null);
      const [gstData, setGstData] = useState(null);

      // Statutory GST Portal States
      const [gstSubTab, setGstSubTab] = useState('gstr3b'); // 'gstr3b' | 'gstr1' | 'itc' | 'checklist'
      const [gstStartDate, setGstStartDate] = useState('2026-08-01');
      const [gstEndDate, setGstEndDate] = useState('2026-09-30');
      const [downloadingJson, setDownloadingJson] = useState(false);
      const [downloadingCsv, setDownloadingCsv] = useState(false);

      // Trial Balance States
      const [trialData, setTrialData] = useState(null);
      const [trialAsOfDate, setTrialAsOfDate] = useState('2026-09-11');

      // Cash Flow States
      const [cashFlowData, setCashFlowData] = useState(null);
      const [cfStartDate, setCfStartDate] = useState('2026-01-01');
      const [cfEndDate, setCfEndDate] = useState('2026-12-31');

      // Principles Knowledge Hub States
      const [principlesData, setPrinciplesData] = useState([]);
      const [principlesStats, setPrinciplesStats] = useState(null);
      const [principlesCategory, setPrinciplesCategory] = useState('all');
      const [principlesSearch, setPrinciplesSearch] = useState('');
      const [showGoogleModal, setShowGoogleModal] = useState(false);
      const [googleTopic, setGoogleTopic] = useState('Prepaid Expenses, Accruals & Statutory Deductions');
      const [googleCount, setGoogleCount] = useState(3);
      const [harvestingGoogle, setHarvestingGoogle] = useState(false);
      const [harvestSuccessMsg, setHarvestSuccessMsg] = useState(null);

      const fetchPnl = async () => {
        setLoading(true);
        try {
          const res = await fetch(`${API_BASE}/reports/profit-loss?start_date=2026-01-01&end_date=2026-12-31`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          const json = await res.json();
          setPnlData(json.data);
        } catch (e) { setError(e.message); }
        finally { setLoading(false); }
      };

      const fetchBalanceSheet = async () => {
        setLoading(true);
        try {
          const res = await fetch(`${API_BASE}/reports/balance-sheet?as_of_date=2026-12-31`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          const json = await res.json();
          setBsData(json.data);
        } catch (e) { setError(e.message); }
        finally { setLoading(false); }
      };

      const fetchTrialBalance = async (asOf = trialAsOfDate) => {
        setLoading(true);
        try {
          const res = await fetch(`${API_BASE}/reports/trial-balance?as_of_date=${asOf}`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          const json = await res.json();
          setTrialData(json.data);
        } catch (e) { setError(e.message); }
        finally { setLoading(false); }
      };

      const fetchCashFlow = async (start = cfStartDate, end = cfEndDate) => {
        setLoading(true);
        try {
          const res = await fetch(`${API_BASE}/reports/cash-flow?start_date=${start}&end_date=${end}`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          const json = await res.json();
          setCashFlowData(json.data);
        } catch (e) { setError(e.message); }
        finally { setLoading(false); }
      };

      const fetchPrinciples = async (cat = principlesCategory, search = principlesSearch) => {
        setLoading(true);
        try {
          let url = `${API_BASE}/reports/principles`;
          const params = [];
          if (cat && cat !== 'all') params.push(`category=${encodeURIComponent(cat)}`);
          if (search) params.push(`search=${encodeURIComponent(search)}`);
          if (params.length > 0) url += `?${params.join('&')}`;

          const res = await fetch(url, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          const json = await res.json();
          setPrinciplesData(json.data || []);
          setPrinciplesStats(json.stats || null);
        } catch (e) { setError(e.message); }
        finally { setLoading(false); }
      };

      const handleCollectFromGoogle = async () => {
        setHarvestingGoogle(true);
        setHarvestSuccessMsg(null);
        try {
          const res = await fetch(`${API_BASE}/reports/principles/collect-google`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({
              topic: googleTopic,
              count: Number(googleCount)
            })
          });
          const json = await res.json();
          if (!json.success) throw new Error(json.error || 'Failed to harvest principles');
          setHarvestSuccessMsg(`Successfully learned ${json.collected_count} principles from Google Database (${json.model})!`);
          fetchPrinciples();
          setTimeout(() => {
            setShowGoogleModal(false);
            setHarvestSuccessMsg(null);
          }, 2200);
        } catch (err) {
          alert('Google Database Harvest Error: ' + err.message);
        } finally {
          setHarvestingGoogle(false);
        }
      };

      const fetchGst = async (start = gstStartDate, end = gstEndDate) => {
        setLoading(true);
        try {
          const res = await fetch(`${API_BASE}/reports/gst?start_date=${start}&end_date=${end}`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          const json = await res.json();
          setGstData(json);
        } catch (e) { setError(e.message); }
        finally { setLoading(false); }
      };

      const handleDownloadPortalJson = async () => {
        setDownloadingJson(true);
        try {
          const res = await fetch(`${API_BASE}/reports/gst/export-json?start_date=${gstStartDate}&end_date=${gstEndDate}`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (!res.ok) throw new Error('Failed to generate GST Portal JSON');
          const blob = await res.blob();
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          const gstin = gstData?.data?.taxpayer?.gstin || '27ABCDE1234F1Z5';
          const fp = gstData?.data?.taxpayer?.return_period || '082026';
          a.download = `GSTR_Portal_Upload_${gstin}_${fp}.json`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          window.URL.revokeObjectURL(url);
        } catch (err) {
          alert('Error downloading GST Portal JSON: ' + err.message);
        } finally {
          setDownloadingJson(false);
        }
      };

      const handleDownloadCsv = async () => {
        setDownloadingCsv(true);
        try {
          const res = await fetch(`${API_BASE}/reports/gst/export-csv?start_date=${gstStartDate}&end_date=${gstEndDate}`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (!res.ok) throw new Error('Failed to generate Statutory CSV');
          const blob = await res.blob();
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          const gstin = gstData?.data?.taxpayer?.gstin || '27ABCDE1234F1Z5';
          const fp = gstData?.data?.taxpayer?.return_period || '082026';
          a.download = `GST_Statutory_Return_${gstin}_${fp}.csv`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          window.URL.revokeObjectURL(url);
        } catch (err) {
          alert('Error downloading CA Audit CSV: ' + err.message);
        } finally {
          setDownloadingCsv(false);
        }
      };

        if (activeTab === 'pnl') fetchPnl();
        else if (activeTab === 'balance_sheet') fetchBalanceSheet();
        else if (activeTab === 'trial_balance') fetchTrialBalance();
        else if (activeTab === 'cash_flow') fetchCashFlow();
        else if (activeTab === 'gst') fetchGst();
        else if (activeTab === 'principles') fetchPrinciples();
      }, [activeTab]);

      return (
        <div className="w-full space-y-6">
          <div className="flex flex-wrap items-center gap-2 p-2 bg-slate-900 border border-slate-800 rounded-2xl">
            <button
              onClick={() => setActiveTab('pnl')}
              className={`px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition ${
                activeTab === 'pnl' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'
              }`}
            >
              📊 Profit & Loss
            </button>
            <button
              onClick={() => setActiveTab('balance_sheet')}
              className={`px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition ${
                activeTab === 'balance_sheet' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'
              }`}
            >
              ⚖️ Balance Sheet
            </button>
            <button
              onClick={() => setActiveTab('trial_balance')}
              className={`px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition ${
                activeTab === 'trial_balance' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:text-white'
              }`}
            >
              📐 Trial Balance (Dr = Cr)
            </button>
            <button
              onClick={() => setActiveTab('cash_flow')}
              className={`px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition ${
                activeTab === 'cash_flow' ? 'bg-teal-600 text-white shadow' : 'text-slate-400 hover:text-white'
              }`}
            >
              💵 Cash Flow (Ind AS 7)
            </button>
            <button

              className={`px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition ${
                activeTab === 'gst' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'
              }`}
            >
              🏛️ GST Return (1 & 3B)
            </button>
            <button
              onClick={() => setActiveTab('principles')}
              className={`px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition ${
                activeTab === 'principles' ? 'bg-purple-600 text-white shadow' : 'text-slate-400 hover:text-white'
              }`}
            >
              🧠 Principles & Golden Rules
            </button>
          </div>

          {loading && <div className="p-8 text-center text-slate-400 animate-pulse">Running SQL Analytical Queries...</div>}

          {!loading && activeTab === 'pnl' && pnlData && (
            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-6">
              <div className="flex justify-between items-center pb-4 border-b border-slate-800">
                <h3 className="text-lg font-bold text-white">Profit & Loss Statement</h3>
                <div className="text-right">

                    <span>Revenue</span>

                      <span className="font-semibold">₹{Number(e.net_amount).toLocaleString('en-IN')}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {!loading && activeTab === 'balance_sheet' && bsData && (

    function LedgerView({ token, refreshTrigger, onTransactionChanged }) {
      const [transactions, setTransactions] = useState([]);
      const [loading, setLoading] = useState(true);
      const [deletingId, setDeletingId] = useState(null);
      const [actionMessage, setActionMessage] = useState(null);
      const [actionError, setActionError] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');

      const fetchTransactions = async () => {
        setLoading(true);
        try {
          const res = await fetch(`${API_BASE}/transactions`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          const data = await res.json();
          setTransactions(data.data || []);
        } catch (e) {
          setActionError(e.message);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchTransactions();
      }, [refreshTrigger]);

      const handleDelete = async (txId, accName, amt) => {
        if (!window.confirm(`Are you sure you want to permanently delete Transaction #${txId} (${accName} - ₹${Number(amt).toLocaleString('en-IN')}) from your accounts?\n\nNote: All balanced ledger postings based on this entry (e.g. Bank Outflow/Inflow or contra accounts) will also be removed.`)) {
          return;
        }
        setDeletingId(txId);
        setActionMessage(null);
        setActionError(null);
        try {
          const res = await fetch(`${API_BASE}/transactions/${txId}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
          });
          const data = await res.json();
          if (!res.ok || !data.success) {
            throw new Error(data.error || 'Failed to delete transaction.');
          }
          setActionMessage(`✓ ${data.message || `Transaction #${txId} deleted permanently from ledger.`}`);
          await fetchTransactions();
          if (onTransactionChanged) onTransactionChanged();
        } catch (err) {
          setActionError(err.message);
        } finally {
          setDeletingId(null);
        }
      };

      const handleClearAll = async () => {
        if (!window.confirm('CAUTION: Are you sure you want to delete ALL entered transactions from your accounts? This will permanently wipe all chat add-ons and entries.')) {
          return;
        }
        setLoading(true);
        setActionMessage(null);
        setActionError(null);
        try {
          const res = await fetch(`${API_BASE}/transactions/clear-all`, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}` }
          });
          const data = await res.json();
          if (!res.ok || !data.success) {
            throw new Error(data.error || 'Failed to clear ledger.');
          }
          setActionMessage(`✓ ${data.message}`);
          await fetchTransactions();
          if (onTransactionChanged) onTransactionChanged();
        } catch (err) {
          setActionError(err.message);
        } finally {
          setLoading(false);
        }
      };

      const filteredTransactions = transactions.filter((t) => {
        if (!searchQuery.trim()) return true;
        const q = searchQuery.toLowerCase();
        return (
          (t.account_name && t.account_name.toLowerCase().includes(q)) ||
          (t.description && t.description.toLowerCase().includes(q)) ||
          (t.raw_ai_input && t.raw_ai_input.toLowerCase().includes(q)) ||
          String(t.id).includes(q) ||
          String(t.amount).includes(q)
        );
      });

      return (
        <div className="w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-slate-800">
            <div>
              <div className="flex items-center gap-2">
                <h3 className="text-lg font-bold text-white">General Accounting Ledger</h3>
                <span className="text-xs px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 font-mono">
                  {transactions.length} entries
                </span>
              </div>
              <p className="text-xs text-slate-400">All journal transactions and natural language chat add-ons</p>
            </div>

            <div className="flex items-center gap-2 flex-wrap">
              <input
                type="text"
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                placeholder="Search account, prompt..."
                className="bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-white placeholder-slate-500 outline-none focus:border-indigo-500 w-44"
              />
              <button
                onClick={fetchTransactions}
                className="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-750 text-xs font-semibold text-slate-300 transition"
              >
                Refresh
              </button>
              {transactions.length > 0 && (
                <button
                  onClick={handleClearAll}
                  className="px-3 py-1.5 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 text-rose-300 border border-rose-500/30 text-xs font-semibold transition flex items-center gap-1"
                  title="Clear all transactions from your account"
                >
                  <span>🗑️</span>
                  <span>Clear All Entries</span>
                </button>
              )}
            </div>
          </div>

          {actionMessage && (
            <div className="p-3 bg-emerald-950/40 border border-emerald-500/40 text-emerald-300 rounded-xl text-xs flex items-center justify-between">
              <span>{actionMessage}</span>
              <button onClick={() => setActionMessage(null)} className="text-emerald-400 font-bold hover:text-white">&times;</button>
            </div>
          )}

          {actionError && (
            <div className="p-3 bg-rose-950/40 border border-rose-500/40 text-rose-300 rounded-xl text-xs flex items-center justify-between">
              <span>{actionError}</span>
              <button onClick={() => setActionError(null)} className="text-rose-400 font-bold hover:text-white">&times;</button>
            </div>
          )}

          {loading ? (
            <div className="p-8 text-center text-slate-400 animate-pulse">Loading ledger entries...</div>
          ) : filteredTransactions.length === 0 ? (
            <div className="p-12 text-center text-slate-500 text-xs space-y-1">
              <p>No transactions found.</p>
              {searchQuery && <p className="text-slate-600">No match for "{searchQuery}". Clear search filter to view all.</p>}
            </div>
          ) : (
            <div className="overflow-x-auto rounded-xl border border-slate-800">
              <table className="w-full text-left text-xs">
                <thead className="bg-slate-950 text-slate-400 uppercase font-semibold">
                  <tr>
                    <th className="p-3">ID</th>
                    <th className="p-3">Date</th>
                    <th className="p-3">Account</th>
                    <th className="p-3">Description</th>
                    <th className="p-3">Type</th>
                    <th className="p-3">Amount</th>
                    <th className="p-3">CGST / SGST</th>
                    <th className="p-3">IGST</th>
                    <th className="p-3 text-right">Action</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800 text-slate-300">
                  {filteredTransactions.map((t) => (
                    <tr key={t.id} className="hover:bg-slate-800/40 transition">
                      <td className="p-3 font-mono text-slate-500">
                        <div>#{t.id}</div>
                        {t.entry_group_id && (
                          <div className="text-[9px] text-indigo-400 font-mono mt-0.5" title={`Linked Entry Group: ${t.entry_group_id}`}>
                            🔗 linked
                          </div>
                        )}
                      </td>
                      <td className="p-3 font-mono">{t.date}</td>
                      <td className="p-3">
                        <div className="font-semibold text-white">{t.account_name}</div>
                        <div className="text-[10px] text-slate-400 uppercase font-mono">{t.account_type}</div>
                      </td>
                      <td className="p-3 max-w-xs truncate">
                        {t.description}
                        {t.raw_ai_input && (
                          <div className="text-[10px] text-slate-500 italic truncate">AI: "{t.raw_ai_input}"</div>
                        )}
                      </td>
                      <td className="p-3">
                        <span className={`px-2 py-0.5 rounded text-[10px] font-bold uppercase ${
                          t.type === 'credit' ? 'bg-emerald-500/20 text-emerald-300' : 'bg-rose-500/20 text-rose-300'
                        }`}>
                          {t.type}
                        </span>
                      </td>
                      <td className="p-3 font-bold text-white font-mono">
                        ₹{Number(t.amount).toLocaleString('en-IN')}
                      </td>
                      <td className="p-3 font-mono text-slate-400">
                        {t.cgst > 0 || t.sgst > 0 ? `₹${t.cgst} / ₹${t.sgst}` : '-'}
                      </td>
                      <td className="p-3 font-mono text-slate-400">
                        {t.igst > 0 ? `₹${t.igst}` : '-'}
                      </td>
                      <td className="p-3 text-right">
                        <button
                          type="button"
                          onClick={() => handleDelete(t.id, t.account_name, t.amount)}
                          disabled={deletingId === t.id}
                          className="px-2.5 py-1 text-xs rounded-lg bg-rose-500/10 hover:bg-rose-500/25 text-rose-400 border border-rose-500/30 transition inline-flex items-center gap-1 font-semibold disabled:opacity-50"
                          title="Delete transaction"
                        >
                          {deletingId === t.id ? (
                            <span className="animate-pulse">Deleting...</span>
                          ) : (
                            <>
                              <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                              </svg>
                              <span>Delete</span>
                            </>
                          )}
                        </button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      );
    }

    // ========================================================================
    function BusinessProfileModal({ isOpen, onClose, token, user, onProfileUpdated, apiBase }) {
  const [activeSubTab, setActiveSubTab] = useState('identity');
  const [loading, setLoading] = useState(false);
  const [saveSuccess, setSaveSuccess] = useState(false);
  const [error, setError] = useState(null);

  // Profile Form States
  const [businessName, setBusinessName] = useState('');
  const [ownerName, setOwnerName] = useState('');
  const [gstNumber, setGstNumber] = useState('');
  const [panNumber, setPanNumber] = useState('');
  const [phone, setPhone] = useState('');
  const [address, setAddress] = useState('');
  const [city, setCity] = useState('');
  const [state, setState] = useState('Maharashtra');
  const [pincode, setPincode] = useState('');
  const [bankName, setBankName] = useState('');
  const [bankAccountNo, setBankAccountNo] = useState('');
  const [bankIfsc, setBankIfsc] = useState('');
  const [bankBranch, setBankBranch] = useState('');
  const [upiId, setUpiId] = useState('');
  const [logoData, setLogoData] = useState('');
  const [invoiceTerms, setInvoiceTerms] = useState('');
  const [signatureTitle, setSignatureTitle] = useState('Authorized Signatory');

  const base = apiBase || (typeof window !== 'undefined' && window.location.pathname.includes('/accounting') ? '/accounting/api' : '/api');

  // Load existing profile from user prop or fetch from server
  useEffect(() => {
    if (isOpen && token) {
      fetchProfile();
    }
  }, [isOpen, token]);

  const fetchProfile = async () => {
    try {
      setLoading(true);
      setError(null);
      const res = await fetch(`${base}/auth/profile`, {
        headers: {
          'Authorization': `Bearer ${token}`
        }
      });
      const data = await res.json();
      if (data.success && data.user) {
        populateFields(data.user);
      } else if (user) {
        populateFields(user);
      }
    } catch (err) {
      if (user) populateFields(user);
    } finally {
      setLoading(false);
    }
  };

  const populateFields = (u) => {
    setBusinessName(u.business_name || '');
    setOwnerName(u.owner_name || '');
    setGstNumber(u.gst_number || '');
    setPanNumber(u.pan_number || '');
    setPhone(u.phone || '');
    setAddress(u.address || '');
    setCity(u.city || '');
    setState(u.state || 'Maharashtra');
    setPincode(u.pincode || '');
    setBankName(u.bank_name || '');
    setBankAccountNo(u.bank_account_no || '');
    setBankIfsc(u.bank_ifsc || '');
    setBankBranch(u.bank_branch || '');
    setUpiId(u.upi_id || '');
    setLogoData(u.logo_data || '');
    setInvoiceTerms(u.invoice_terms || "1. Payment is due within 15 days of invoice date.\n2. Overdue payments will incur 18% annual interest.\n3. Goods/Services once delivered are non-refundable.\n4. All disputes subject to local jurisdiction.");
    setSignatureTitle(u.signature_title || 'Authorized Signatory');
  };

  // Handle Logo Upload via FileReader
  const handleLogoUpload = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;

    if (file.size > 2 * 1024 * 1024) {
      setError('Logo image must be under 2MB.');
      return;
    }

    const reader = new FileReader();
    reader.onload = () => {
      setLogoData(reader.result);
      setError(null);
    };
    reader.onerror = () => {
      setError('Failed to read image file.');
    };
    reader.readAsDataURL(file);
  };

  const handleSave = async (e) => {
    if (e) e.preventDefault();
    setLoading(true);
    setError(null);
    setSaveSuccess(false);

    try {
      const payload = {
        business_name: businessName,
        owner_name: ownerName,
        gst_number: gstNumber,
        pan_number: panNumber,
        phone: phone,
        address: address,
        city: city,
        state: state,
        pincode: pincode,
        bank_name: bankName,
        bank_account_no: bankAccountNo,
        bank_ifsc: bankIfsc,
        bank_branch: bankBranch,
        upi_id: upiId,
        logo_data: logoData,
        invoice_terms: invoiceTerms,
        signature_title: signatureTitle
      };

      const res = await fetch(`${base}/auth/profile`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify(payload)
      });

      const data = await res.json();
      if (!data.success) {
        throw new Error(data.error || 'Failed to update business profile.');
      }

      setSaveSuccess(true);

    // Helper: Convert numbers to Indian Rupees in words
function numberToIndianWords(num) {
  if (!num || isNaN(num) || num <= 0) return 'Zero Rupees Only';
  const a = ['', 'One ', 'Two ', 'Three ', 'Four ', 'Five ', 'Six ', 'Seven ', 'Eight ', 'Nine ', 'Ten ', 'Eleven ', 'Twelve ', 'Thirteen ', 'Fourteen ', 'Fifteen ', 'Sixteen ', 'Seventeen ', 'Eighteen ', 'Nineteen '];
  const b = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];

  const n = Math.floor(Math.abs(num));
  const paise = Math.round((Math.abs(num) - n) * 100);

  function inWords(val) {
    let str = '';
    if (val > 9999999) {
      str += inWords(Math.floor(val / 10000000)) + 'Crore ';
      val %= 10000000;
    }
    if (val > 99999) {
      str += inWords(Math.floor(val / 100000)) + 'Lakh ';
      val %= 100000;
    }
    if (val > 999) {
      str += inWords(Math.floor(val / 1000)) + 'Thousand ';
      val %= 1000;
    }
    if (val > 99) {
      str += inWords(Math.floor(val / 100)) + 'Hundred ';
      val %= 100;
    }
    if (val > 0) {
      if (val < 20) {
        str += a[val];
      } else {
        str += b[Math.floor(val / 10)] + (val % 10 !== 0 ? ' ' + a[val % 10] : ' ');
      }
    }
    return str;
  }

  let words = inWords(n);
  if (!words.trim()) words = 'Zero ';
  let result = 'Rupees ' + words.trim();
  if (paise > 0) {
    result += ' and ' + inWords(paise).trim() + 'Paise';
  }
  return result + ' Only';
}

  const base = apiBase || (typeof window !== 'undefined' && window.location.pathname.includes('/accounting') ? '/accounting/api' : '/api');

  // Load business profile and invoice list on mount
  useEffect(() => {
    if (token) {
      fetchBusinessProfile();
      fetchInvoices();
      generateNextInvoiceNumber();
    }
  }, [token]);

  const generateNextInvoiceNumber = () => {
    const today = new Date();
    const y = today.getFullYear();
    const m = String(today.getMonth() + 1).padStart(2, '0');
    const rand = Math.floor(1000 + Math.random() * 9000);
    setInvoiceNumber(`INV-${y}${m}-${rand}`);
  };

  const fetchBusinessProfile = async () => {
    try {
      const res = await fetch(`${base}/auth/profile`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const data = await res.json();
      if (data.success && data.user) {
        setBusinessProfile(data.user);
        if (data.user.state) {
          setPlaceOfSupply(data.user.state);
        }
        if (data.user.invoice_terms && !terms) {
          setTerms(data.user.invoice_terms);
        }
      }
    } catch (err) {
      console.error("Failed to fetch business profile", err);
    }
  };

  const fetchInvoices = async (isBackground = false) => {
    try {
      if (!isBackground) setLoading(true);
      const res = await fetch(`${base}/invoices`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const data = await res.json();
      if (data.success) {
        setInvoices(data.invoices || []);
      }
    } catch (err) {
      console.warn("Failed to fetch invoices", err);
    } finally {
      if (!isBackground) setLoading(false);
    }
  };

  // Line item change handlers
  const handleItemChange = (index, field, value) => {
    setItems(prev => {
      const next = [...prev];
      next[index] = { ...next[index], [field]: value };
      return next;
    });
  };

  const addItemRow = () => {
    setItems(prev => [
      ...prev,
      {
        item_description: '',
        hsn_code: '',
        quantity: 1,
        unit: 'Pcs',
        unit_price: 0,
        discount_percent: 0,
        gst_rate: 18
      }
    ]);
  };

  const removeItemRow = (index) => {
    if (items.length <= 1) return;
    setItems(prev => prev.filter((_, i) => i !== index));
  };

  // Live Tax Computations
  const sellerState = (businessProfile && businessProfile.state) ? businessProfile.state.toLowerCase().trim() : '';
  const clientState = customerState ? customerState.toLowerCase().trim() : (placeOfSupply ? placeOfSupply.toLowerCase().trim() : '');
  const isInterstate = Boolean(sellerState && clientState && sellerState !== clientState);

  let computedSubtotal = 0;
  let computedCgst = 0;
  let computedSgst = 0;
  let computedIgst = 0;

  const itemCalculations = items.map(item => {
    const qty = Math.max(0, parseFloat(item.quantity) || 0);
    const price = Math.max(0, parseFloat(item.unit_price) || 0);
    const discount = Math.max(0, Math.min(100, parseFloat(item.discount_percent) || 0));
    const gstRate = Math.max(0, parseFloat(item.gst_rate) || 0);

    const baseAmount = qty * price;
    const taxable = baseAmount * (1 - discount / 100);

    let cgst = 0, sgst = 0, igst = 0;
    if (isInterstate) {
      igst = taxable * (gstRate / 100);
    } else {
      cgst = taxable * ((gstRate / 2) / 100);
      sgst = taxable * ((gstRate / 2) / 100);
    }

    const lineTotal = taxable + cgst + sgst + igst;

    computedSubtotal += taxable;
    computedCgst += cgst;
    computedSgst += sgst;
    computedIgst += igst;

    return {
      taxable: taxable.toFixed(2),
      cgst: cgst.toFixed(2),
      sgst: sgst.toFixed(2),
      igst: igst.toFixed(2),
      total: lineTotal.toFixed(2)
    };
  });

  const grandTotal = computedSubtotal + computedCgst + computedSgst + computedIgst;

  // Form Submit: Create Invoice & Immediately Open Print Preview
  const handleSubmitInvoice = async (e) => {
    if (e) e.preventDefault();
    setError(null);

    if (!customerName.trim()) {
      setError('Please enter customer / client name.');
      return;
    }

    const validItems = items.filter(it => it.item_description && it.item_description.trim().length > 0);
    if (validItems.length === 0) {
      setError('Please provide at least one valid line item with description and price.');
      return;
    }

    setSubmitting(true);
    try {
      const payload = {
        invoice_number: invoiceNumber,
        invoice_date: invoiceDate,
        due_date: dueDate,
        customer_name: customerName,
        customer_phone: customerPhone,
        customer_email: customerEmail,
        customer_address: customerAddress,
        customer_state: customerState,
        customer_gstin: customerGstin,
        place_of_supply: placeOfSupply,
        payment_status: paymentStatus,
        payment_mode: paymentMode,
        notes: notes,
        terms: terms,
        post_to_ledger: postToLedger,
        items: validItems.map(it => ({
          item_description: it.item_description,
          hsn_code: it.hsn_code,
          quantity: parseFloat(it.quantity) || 1,
          unit: it.unit || 'Pcs',
          unit_price: parseFloat(it.unit_price) || 0,
          discount_percent: parseFloat(it.discount_percent) || 0,
          gst_rate: parseFloat(it.gst_rate) || 18
        }))
      };

      const res = await fetch(`${base}/invoices`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify(payload)
      });

      const data = await res.json();
      if (!data.success) {
        if (data.upgrade_required && onUpgradeRequired) {
          onUpgradeRequired(data.error || 'Invoice limit reached on current plan. Please upgrade to continue.');
          return;
        }
        throw new Error(data.error || 'Failed to generate invoice.');
      }

      // Construct robust invoice print object
      const fullInvoice = data.invoice || {
        id: data.invoice_id,
        invoice_number: data.invoice_number || invoiceNumber,
        invoice_date: data.invoice_date || invoiceDate,
        due_date: dueDate,
        customer_name: customerName,
        customer_phone: customerPhone,
        customer_email: customerEmail,
        customer_address: customerAddress,
        customer_state: customerState,
        customer_gstin: customerGstin,
        place_of_supply: placeOfSupply,
        payment_status: data.payment_status || paymentStatus,
        payment_mode: paymentMode,
        subtotal: computedSubtotal,
        cgst_amount: computedCgst,
        sgst_amount: computedSgst,
        igst_amount: computedIgst,
        total_amount: data.total_amount || grandTotal,
        notes: notes,
        terms: terms
      };

      const fullItems = (data.items && data.items.length > 0) ? data.items : validItems.map(it => {
        const qty = parseFloat(it.quantity) || 1;
        const price = parseFloat(it.unit_price) || 0;
        const disc = parseFloat(it.discount_percent) || 0;
        const gst = parseFloat(it.gst_rate) || 18;
        const taxable = (qty * price) * (1 - disc / 100);
        return {
          item_description: it.item_description,
          hsn_code: it.hsn_code,
          quantity: qty,
          unit: it.unit || 'Pcs',
          unit_price: price,
          discount_percent: disc,
          gst_rate: gst,
          taxable_amount: taxable,
          total_amount: taxable * (1 + gst / 100)
        };
      });

      const fullBusiness = data.business || businessProfile;

      // 1. Immediately open Executive Printable Bill Preview Modal!
      setPrintInvoiceData({
        invoice: fullInvoice,
        items: fullItems,
        business: fullBusiness
      });
      setShowPrintModal(true);

      // 2. Set success banner
      setSuccessBanner({
        invoice_id: data.invoice_id,
        invoice_number: data.invoice_number || invoiceNumber,
        total_amount: data.total_amount || grandTotal,
        posted_to_ledger: data.posted_to_ledger,
        customer_name: customerName,
        customer_phone: customerPhone,
        invoice_date: data.invoice_date || invoiceDate,
        payment_status: data.payment_status || paymentStatus
      });

      // 3. Automatically trigger browser print dialog after modal is rendered
      setTimeout(() => {
        try {
          window.print();
        } catch (printErr) {
          console.warn("Auto print error:", printErr);
        }
      }, 500);

      // 4. Generate next invoice number so subsequent creations have a fresh ID
      generateNextInvoiceNumber();

      // 5. Notify parent & refresh invoice list in background
      if (onInvoicePosted) {
        onInvoicePosted();
      }
      fetchInvoices(true);
    } catch (err) {
      setError(err.message);
    } finally {
      setSubmitting(false);
    }
  };

  // Open Printable View for an invoice
  const handleOpenPrint = async (invId) => {
    try {
      setLoading(true);
      const res = await fetch(`${base}/invoices/${invId}`, {
        headers: { 'Authorization': `Bearer ${token}` }

      const data = await res.json();
      if (data.success) {
        setPrintInvoiceData({
          invoice: data.invoice,
          items: data.items,
          business: data.business || businessProfile
        });
        setShowPrintModal(true);
      } else {
        alert(data.error || 'Failed to load invoice details');
      }
    } catch (err) {
      alert('Error fetching invoice details: ' + err.message);
    } finally {
      setLoading(false);
    }
  };

  // Delete Invoice
  const handleDeleteInvoice = async (invId) => {
    if (!window.confirm('Are you sure you want to delete this invoice? Any associated ledger transactions will also be automatically removed.')) {
      return;

    try {
      setLoading(true);
      const res = await fetch(`${base}/invoices/${invId}`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${token}` }

      const data = await res.json();
      if (data.success) {
        fetchInvoices();
        if (onInvoicePosted) onInvoicePosted();
      } else {

            </button>
          </div>
        </div>
      </div>

      {/* Copied to clipboard Toast */}
      {copiedNotification && (
        <div className="fixed bottom-6 right-6 z-50 bg-emerald-600 text-white px-4 py-2.5 rounded-xl shadow-2xl text-xs font-bold flex items-center gap-2 animate-bounce">
          <span>✓ Bill summary copied to clipboard!</span>
        </div>

      {/* SUCCESS BANNER AFTER INVOICE CREATION */}
      {successBanner && (
        <div className="p-5 bg-emerald-950/40 border border-emerald-500/50 rounded-2xl shadow-xl space-y-4">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-emerald-500/30 pb-3">

              </div>
              <div>

                <p className="text-xs text-emerald-400/80">

            <button

              className="px-3.5 py-1.5 rounded-xl border border-slate-700 bg-slate-800 hover:bg-slate-750 text-slate-300 text-xs font-semibold"

              + Create Another Bill

          {/* Quick Actions */}
          <div className="flex flex-wrap items-center gap-3 pt-1">
            <button

            <a

            <button

      {/* ERROR ALERT */}
      {error && (
