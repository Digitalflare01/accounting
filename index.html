    function App() {
      const [token, setToken] = useState(localStorage.getItem('accounting_token') || '');
      const [user, setUser] = useState(null);
      const [activeTab, setActiveTab] = useState('entry'); // 'entry' | 'invoicing' | 'depreciation' | 'reports' | 'ledger'
      const [refreshTrigger, setRefreshTrigger] = useState(0);
      const [showProfileModal, setShowProfileModal] = useState(false);
      const [showSubscriptionModal, setShowSubscriptionModal] = useState(false);
      const [subModalAlert, setSubModalAlert] = useState(null);
      const [mySubscription, setMySubscription] = useState(null);

      // Auth Screen States (Sign In vs Sign Up)
      const [authMode, setAuthMode] = useState('login'); // 'login' | 'register'
      const [loginEmail, setLoginEmail] = useState('admin@accounting.local');
      const [loginPassword, setLoginPassword] = useState('Password123!');
      
      const [regBusinessName, setRegBusinessName] = useState('');
      const [regEmail, setRegEmail] = useState('');
      const [regPassword, setRegPassword] = useState('');
      const [regGstin, setRegGstin] = useState('');

      const [authError, setAuthError] = useState(null);
      const [authLoading, setAuthLoading] = useState(false);
      const [announcement, setAnnouncement] = useState(null);

      const fetchMySubscription = async (authToken) => {
        try {
          const res = await fetch(`${API_BASE}/subscriptions/my`, {
            headers: { 'Authorization': `Bearer ${authToken}` }
          });
          const data = await res.json();
          if (res.ok && data.success) {
            setMySubscription(data);
          }
        } catch (e) {}
      };

      const handleUpgradeRequired = (msg) => {
        setSubModalAlert(msg || 'Plan quota limit reached. Please upgrade to continue.');
        setShowSubscriptionModal(true);
      };

      useEffect(() => {
        if (token) {
          fetchUser(token);
          fetchMySubscription(token);
        }
        // Fetch broadcast announcement
        fetch(`${API_BASE}/admin/announcement`)
          .then(res => res.json())
          .then(data => {
            if (data.success && data.data && data.data.announcement_active === '1' && data.data.announcement_text) {
              setAnnouncement(data.data.announcement_text);
            }
          })
          .catch(() => {});
      }, [token]);

      const fetchUser = async (authToken) => {
        try {
          const res = await fetch(`${API_BASE}/auth/me`, {
            headers: { 'Authorization': `Bearer ${authToken}` }
          });
          const data = await res.json();
          if (res.ok && data.success) {
            setUser(data.user);
          } else {
            handleLogout();
          }
        } catch (e) {
          // ignore
        }
      };

      const handleLogin = async (e) => {
        e.preventDefault();
        setAuthLoading(true);
        setAuthError(null);
        try {
          const res = await fetch(`${API_BASE}/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: loginEmail.trim(), password: loginPassword })
          });
          const contentType = res.headers.get('content-type') || '';
          if (!contentType.includes('application/json')) {
            throw new Error(`API server returned non-JSON response (${res.status} ${res.statusText}). Please check server /api routing.`);
          }
          const data = await res.json();
          if (!res.ok || !data.success) {
            throw new Error(data.error || 'Invalid credentials');
          }
          setToken(data.token);
          setUser(data.user);
          localStorage.setItem('accounting_token', data.token);
          fetchMySubscription(data.token);
        } catch (err) {
          setAuthError(err.message);
        } finally {
          setAuthLoading(false);
        }
      };

      const handleRegister = async (e) => {
        e.preventDefault();
        setAuthLoading(true);
        setAuthError(null);
        try {
          const res = await fetch(`${API_BASE}/auth/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              business_name: regBusinessName.trim() || 'My Business',
              email: regEmail.trim(),
              password: regPassword,
              gst_number: regGstin.trim()
            })
          });
          const data = await res.json();
          if (!res.ok || !data.success) {
            throw new Error(data.error || 'Registration failed');
          }
          setToken(data.token);
          setUser(data.user);
          localStorage.setItem('accounting_token', data.token);
          fetchMySubscription(data.token);
        } catch (err) {
          setAuthError(err.message);
        } finally {
          setAuthLoading(false);
        }
      };

      const handleLogout = () => {
        setToken('');
        setUser(null);
        setMySubscription(null);
        localStorage.removeItem('accounting_token');
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header */}
          <header className="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-50">
            <div className="w-full px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center text-white font-black text-xl shadow-lg shadow-indigo-500/25">
                  Σ
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-extrabold text-lg text-white">ApexLedger AI</span>
                    <span className="text-[10px] px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 font-semibold border border-indigo-500/30">
                      Dual-Engine (PHP + Python)
                    </span>
                  </div>
                  <p className="text-xs text-slate-400">AI Accounting & Indian Tax Preparation System</p>
                </div>
              </div>

              {token && user && (
                <div className="flex items-center gap-3">
                  <button
                    type="button"
                    onClick={() => setShowProfileModal(true)}
                    className="text-xs px-3 py-1.5 rounded-lg border border-indigo-500/40 bg-indigo-500/10 hover:bg-indigo-500/20 text-indigo-300 font-bold transition flex items-center gap-1.5 shadow-sm"
                  >
                    <span>🏢 Profile & Logo</span>
                  </button>

                  {/* Subscription Pill */}
                  {mySubscription?.subscription && (
                    <button
                      type="button"
                      onClick={() => { setSubModalAlert(null); setShowSubscriptionModal(true); }}
                      className={`text-xs px-3 py-1.5 rounded-lg border font-bold transition flex items-center gap-1.5 shadow-sm ${
                        mySubscription.subscription.plan_slug === 'free'
                          ? 'border-amber-500/40 bg-amber-500/10 hover:bg-amber-500/20 text-amber-300'
                          : mySubscription.subscription.plan_slug === 'enterprise'
                          ? 'border-purple-500/40 bg-purple-500/15 hover:bg-purple-500/25 text-purple-300'
                          : 'border-indigo-500/40 bg-indigo-500/15 hover:bg-indigo-500/25 text-indigo-300'
                      }`}
                      title="Manage Subscription & Limits"
                    >
                      <span>
                        {mySubscription.subscription.plan_slug === 'free' ? '✨ Free Plan' : `💎 ${mySubscription.subscription.plan_name}`}
                      </span>
                      {mySubscription.subscription.plan_slug === 'free' && (
                        <span className="text-[10px] text-amber-200/80 font-mono">
                          ({mySubscription.usage?.transactions_count || 0}/{mySubscription.limits?.max_transactions || 15} tx)
                        </span>
                      )}
                      <span className="bg-white/15 text-white text-[9px] px-1.5 py-0.2 rounded uppercase font-black tracking-wider">
                        {mySubscription.subscription.plan_slug === 'free' ? 'Upgrade' : 'Plans'}
                      </span>
                    </button>
                  )}

                  {user.role === 'admin' && (
                    <a
                      href={window.location.pathname.includes('/accounting') ? '/accounting/admin/' : '/admin/'}
                      target="_blank"
                      className="text-xs px-3 py-1.5 rounded-lg border border-purple-500/40 bg-purple-500/15 hover:bg-purple-500/25 text-purple-300 font-bold transition flex items-center gap-1.5 shadow-sm"
                    >
                      <span>🛡️ Admin Console</span>
                    </a>
                  )}
                  <div className="text-right hidden sm:block">
                    <div className="text-xs font-semibold text-white">{user.business_name || user.email}</div>
                    <div className="text-[11px] font-mono text-slate-400">
                      GSTIN: <span className="text-indigo-400 font-bold">{user.gst_number || 'Unregistered'}</span>
                    </div>
                  </div>
                  <button
                    onClick={handleLogout}
                    className="text-xs px-3 py-1.5 rounded-lg border border-slate-700 bg-slate-800 hover:bg-slate-750 text-slate-300 transition"
                  >
                    Sign Out
                  </button>
                </div>
              )}
            </div>
          </header>

          {/* Broadcast Announcement Banner if Active */}
          {announcement && (
            <div className="bg-amber-500/10 border-b border-amber-500/30 text-amber-200 px-4 sm:px-6 lg:px-8 py-2.5 text-xs flex items-center justify-between">
              <div className="w-full flex items-center gap-2">
                <span className="font-bold uppercase tracking-wider text-[10px] bg-amber-500/20 px-2 py-0.5 rounded border border-amber-500/30">Notice</span>
                <span>{announcement}</span>
              </div>
            </div>
          )}

          {/* Main Content */}
          <main className="flex-1 w-full px-4 sm:px-6 lg:px-8 py-6 space-y-6">
            {!token ? (
              /* Auth Screen: Sign In & Sign Up */
              <div className="max-w-md mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl space-y-6">
                
                {/* Switcher */}
                <div className="flex bg-slate-950 p-1 rounded-xl border border-slate-800">
                  <button
                    onClick={() => { setAuthMode('login'); setAuthError(null); }}
                    className={`flex-1 py-2 text-xs font-bold rounded-lg transition ${
                      authMode === 'login' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    Sign In
                  </button>
                  <button
                    onClick={() => { setAuthMode('register'); setAuthError(null); }}
                    className={`flex-1 py-2 text-xs font-bold rounded-lg transition ${
                      authMode === 'register' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    Create Account
                  </button>
                </div>

                {authError && (
                  <div className="p-3 bg-rose-950/40 border border-rose-500/40 text-rose-300 rounded-xl text-xs">
                    {authError}
                  </div>
                )}

                {authMode === 'login' ? (
                  /* Login Form */
                  <form onSubmit={handleLogin} className="space-y-4">
                    <div>
                      <label className="block text-xs font-semibold text-slate-400 mb-1">Email Address</label>
                      <input
                        type="email"
                        value={loginEmail}
                        onChange={(e) => setLoginEmail(e.target.value)}
                        placeholder="you@company.com"
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:border-indigo-500 outline-none"
                        required
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-400 mb-1">Password</label>
                      <input
                        type="password"
                        value={loginPassword}
                        onChange={(e) => setLoginPassword(e.target.value)}
                        placeholder="••••••••"
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:border-indigo-500 outline-none"
                        required
                      />
                    </div>
                    <button
                      type="submit"
                      disabled={authLoading}
                      className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl shadow-lg shadow-indigo-600/25 transition text-sm"
                    >
                      {authLoading ? 'Signing In...' : 'Sign In to Account'}
                    </button>
                    <div className="text-[11px] text-center text-slate-500">
                      Default Seed: <span className="text-slate-400 font-mono">admin@accounting.local</span> / <span className="text-slate-400 font-mono">Password123!</span>
                    </div>
                  </form>
                ) : (
                  /* Register Form */
                  <form onSubmit={handleRegister} className="space-y-4">
                    <div>
                      <label className="block text-xs font-semibold text-slate-400 mb-1">Business / Enterprise Name</label>
                      <input
                        type="text"
                        value={regBusinessName}
                        onChange={(e) => setRegBusinessName(e.target.value)}
                        placeholder="e.g., Nexus Digital Solutions LLP"
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:border-indigo-500 outline-none"
                        required
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-400 mb-1">Email Address</label>
                      <input
                        type="email"
                        value={regEmail}
                        onChange={(e) => setRegEmail(e.target.value)}
                        placeholder="founder@nexus.com"
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:border-indigo-500 outline-none"
                        required
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-400 mb-1">Password (min 6 characters)</label>
                      <input
                        type="password"
                        value={regPassword}
                        onChange={(e) => setRegPassword(e.target.value)}
                        placeholder="Create secure password"
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:border-indigo-500 outline-none"
                        minLength="6"
                        required
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-400 mb-1">GST Number (GSTIN - Optional)</label>
                      <input
                        type="text"
                        value={regGstin}
                        onChange={(e) => setRegGstin(e.target.value)}
                        placeholder="e.g., 27ABCDE1234F1Z5"
                        maxLength="15"
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:border-indigo-500 outline-none uppercase font-mono"
                      />
                    </div>
                    <button
                      type="submit"
                      disabled={authLoading}
                      className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl shadow-lg shadow-emerald-600/25 transition text-sm"
                    >
                      {authLoading ? 'Creating Account...' : 'Register Individual Account'}
                    </button>
                  </form>
                )}
              </div>
            ) : (
              /* Authenticated Navigation & Views */
              <>
                <div className="flex flex-wrap items-center gap-2 border-b border-slate-800 pb-4">
                  <button
                    onClick={() => setActiveTab('entry')}
                    className={`px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition ${
                      activeTab === 'entry' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/25' : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    AI Ingestion & Disambiguation
                  </button>
                  <button
                    onClick={() => setActiveTab('documents')}
                    className={`px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition flex items-center gap-1.5 ${
                      activeTab === 'documents' ? 'bg-gradient-to-r from-indigo-600 via-purple-600 to-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    <span>📁 Document Ingestion</span>
                    <span className="text-[9px] px-1.5 py-0.2 rounded bg-white/20 text-white font-black tracking-wider uppercase">
                      AI
                    </span>
                  </button>
                  <button
                    onClick={() => setActiveTab('invoicing')}
                    className={`px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition ${
                      activeTab === 'invoicing' ? 'bg-gradient-to-r from-indigo-600 to-purple-600 text-white shadow-lg shadow-indigo-600/25' : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    🧾 Invoicing & Billing
                  </button>
                  <button
                    onClick={() => setActiveTab('depreciation')}
                    className={`px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition ${
                      activeTab === 'depreciation' ? 'bg-teal-600 text-white shadow-lg shadow-teal-600/25' : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    AI Depreciation Advisor
                  </button>
                  <button
                    onClick={() => setActiveTab('reports')}
                    className={`px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition ${
                      activeTab === 'reports' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/25' : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    Financial Reports & Accounting Principles
                  </button>
                  <button
                    onClick={() => setActiveTab('ledger')}
                    className={`px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition ${
                      activeTab === 'ledger' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/25' : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    General Ledger
                  </button>
                </div>

                {/* Free Plan Experience Banner */}
                {mySubscription?.subscription?.plan_slug === 'free' && (
                  <div className="bg-gradient-to-r from-amber-500/10 via-indigo-500/10 to-purple-500/10 border border-amber-500/30 rounded-2xl p-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 shadow-lg">
                    <div className="flex items-center gap-3">
                      <div className="w-10 h-10 rounded-xl bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-amber-300 text-xl font-bold">
                        ✨
                      </div>
                      <div>
                        <h4 className="text-xs font-bold text-amber-200 flex items-center gap-2">
                          <span>Free Plan Active &bull; Experience Full Software Capabilities</span>
                          <span className="text-[10px] px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30">
                            15 Tx &bull; 5 Invoices &bull; 10 AI Queries
                          </span>
                        </h4>
                        <p className="text-[11px] text-slate-300 mt-0.5">
                          Experience full Double-Entry Ledger, Financial Statements (P&L, Balance Sheet, Trial Balance), and GST Billing.
                        </p>
                      </div>
                    </div>
                    <div className="flex items-center gap-3 self-end sm:self-center">
                      <div className="text-right hidden md:block text-[11px] font-mono text-slate-400">
                        Remaining: <span className="text-amber-400 font-bold">{mySubscription.limits?.transactions_remaining ?? 15} Tx</span> &bull; <span className="text-amber-400 font-bold">{mySubscription.limits?.invoices_remaining ?? 5} Inv</span>
                      </div>
                      <button
                        onClick={() => { setSubModalAlert(null); setShowSubscriptionModal(true); }}
                        className="px-3.5 py-1.5 rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-slate-950 text-xs font-black shadow-md transition whitespace-nowrap"
                      >
                        Upgrade Plan
                      </button>
                    </div>
                  </div>
                )}

                {activeTab === 'entry' && (
                  <TransactionEntry
                    token={token}
                    onTransactionSaved={() => { setRefreshTrigger(t => t + 1); fetchMySubscription(token); }}
                    onUpgradeRequired={handleUpgradeRequired}
                  />
                )}

                {activeTab === 'documents' && (
                  <DocumentIngestionView
                    token={token}
                    user={user}
                    onTransactionsPosted={() => { setRefreshTrigger(t => t + 1); fetchMySubscription(token); }}
                    onSwitchTab={(tabName) => setActiveTab(tabName)}
                    onUpgradeRequired={handleUpgradeRequired}
                  />
                )}

                {activeTab === 'invoicing' && (
                  <InvoicingView
                    token={token}
                    user={user}
                    onInvoicePosted={() => { setRefreshTrigger(t => t + 1); fetchMySubscription(token); }}
                    onOpenProfile={() => setShowProfileModal(true)}
                    onUpgradeRequired={handleUpgradeRequired}
                  />
                )}

                {activeTab === 'depreciation' && (
                  <AIDepreciationAdvisor
                    token={token}
                    onDepreciationPosted={() => { setRefreshTrigger(t => t + 1); fetchMySubscription(token); }}
                  />
                )}

                {activeTab === 'reports' && (
                  <ReportsView token={token} />
                )}

                {activeTab === 'ledger' && (
                  <LedgerView
                    token={token}
                    refreshTrigger={refreshTrigger}
                    onTransactionChanged={() => { setRefreshTrigger(t => t + 1); fetchMySubscription(token); }}
                  />
                )}
              </>
            )}
          </main>

          {/* Business Profile & Logo Configuration Modal */}
          <BusinessProfileModal
            isOpen={showProfileModal}
            onClose={() => setShowProfileModal(false)}
            token={token}
            user={user}
            onProfileUpdated={(updated) => setUser(updated)}
          />

          {/* Subscription Plans & Upgrades Modal */}
          <SubscriptionModal
            isOpen={showSubscriptionModal}
            onClose={() => { setShowSubscriptionModal(false); setSubModalAlert(null); }}
            token={token}
            user={user}
            initialAlert={subModalAlert}
            onSubscriptionUpdated={(updatedPlan) => {
              fetchUser(token);
              fetchMySubscription(token);
            }}
          />

          <footer className="border-t border-slate-800 bg-slate-950 py-5 text-center text-xs text-slate-500">
            ApexLedger AI Architecture &bull; Core Backend: PHP 8.3 REST &bull; AI Microservice: Python FastAPI (Gemini API) &bull; MySQL / SQLite Ledger
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
