                    <p>Place of Supply: <strong>{printInvoiceData.invoice?.place_of_supply || printInvoiceData.business?.state || ''}</strong></p>
                    <p>Payment: <strong className="uppercase">{printInvoiceData.invoice?.payment_status || 'Unpaid'}</strong></p>
                  </div>
                </div>
              </div>

              {/* Billed To Box */}
              <div className="grid grid-cols-2 gap-4 border border-slate-300 rounded p-3 mb-4 text-xs bg-slate-50">
                <div>
                  <span className="font-bold text-slate-500 uppercase tracking-wider text-[10px] block mb-1">Billed To (Client):</span>
                  <h3 className="font-bold text-sm text-slate-900">{printInvoiceData.invoice?.customer_name || 'Customer'}</h3>
                  {printInvoiceData.invoice?.customer_address && (
                    <p className="text-slate-700 whitespace-pre-line mt-0.5">{printInvoiceData.invoice.customer_address}</p>
                  )}
                  <p className="text-slate-700 mt-0.5">
                    State: <strong>{printInvoiceData.invoice?.customer_state || printInvoiceData.invoice?.place_of_supply || 'N/A'}</strong>
                  </p>
                  {printInvoiceData.invoice?.customer_phone && (
                    <p className="text-slate-700">Phone: {printInvoiceData.invoice.customer_phone}</p>
                  )}
                </div>

                <div className="text-right space-y-1">
                  {printInvoiceData.invoice?.customer_gstin && (
                    <p>Customer GSTIN: <strong className="font-mono">{printInvoiceData.invoice.customer_gstin}</strong></p>
                  )}
                  {printInvoiceData.invoice?.customer_email && (
                    <p>Email: {printInvoiceData.invoice.customer_email}</p>
                  )}
                </div>
              </div>

              {/* Line Items Table */}
              <table className="w-full border-collapse border border-slate-300 text-xs mb-4">
                <thead>
                  <tr className="bg-slate-100 text-slate-900 font-bold border-b border-slate-300">
                    <th className="border border-slate-300 py-2 px-2 text-center w-8">#</th>
                    <th className="border border-slate-300 py-2 px-3 text-left">Item / Description</th>
                    <th className="border border-slate-300 py-2 px-2 text-center w-16">HSN/SAC</th>
                    <th className="border border-slate-300 py-2 px-2 text-center w-12">Qty</th>
                    <th className="border border-slate-300 py-2 px-2 text-center w-12">Unit</th>
                    <th className="border border-slate-300 py-2 px-2 text-right w-20">Rate (₹)</th>
                    <th className="border border-slate-300 py-2 px-2 text-right w-12">Disc %</th>
                    <th className="border border-slate-300 py-2 px-2 text-right w-20">Taxable (₹)</th>
                    <th className="border border-slate-300 py-2 px-2 text-right w-14">GST %</th>
                    <th className="border border-slate-300 py-2 px-3 text-right w-24">Total (₹)</th>
                  </tr>
                </thead>
                <tbody>
                  {(printInvoiceData.items || []).map((it, idx) => (
                    <tr key={idx} className="border-b border-slate-200">
                      <td className="border border-slate-300 py-1.5 px-2 text-center text-slate-600">{idx + 1}</td>
                      <td className="border border-slate-300 py-1.5 px-3 font-medium text-slate-900">{it.item_description}</td>
                      <td className="border border-slate-300 py-1.5 px-2 text-center font-mono text-slate-700">{it.hsn_code || '-'}</td>
                      <td className="border border-slate-300 py-1.5 px-2 text-center font-mono">{parseFloat(it.quantity || 1)}</td>
                      <td className="border border-slate-300 py-1.5 px-2 text-center">{it.unit || 'Pcs'}</td>
                      <td className="border border-slate-300 py-1.5 px-2 text-right font-mono">{parseFloat(it.unit_price || 0).toFixed(2)}</td>
                      <td className="border border-slate-300 py-1.5 px-2 text-right font-mono">{parseFloat(it.discount_percent || 0)}%</td>
                      <td className="border border-slate-300 py-1.5 px-2 text-right font-mono">{parseFloat(it.taxable_amount || 0).toFixed(2)}</td>
                      <td className="border border-slate-300 py-1.5 px-2 text-right font-mono">{parseFloat(it.gst_rate || 0)}%</td>
                      <td className="border border-slate-300 py-1.5 px-3 text-right font-mono font-bold text-slate-900">
                        {parseFloat(it.total_amount || 0).toFixed(2)}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>

              {/* Totals & Tax Summary Block */}
              <div className="grid grid-cols-2 gap-4 mb-4 text-xs">
                
                {/* Left: Bank Details for Payment */}
                <div className="border border-slate-300 rounded p-3 bg-slate-50 space-y-1">
                  <span className="font-bold text-slate-800 uppercase tracking-wider text-[10px] block mb-1">
                    Bank & Settlement Coordinates:
                  </span>
                  {printInvoiceData.business?.bank_name ? (
                    <>
                      <p>Bank: <strong>{printInvoiceData.business.bank_name}</strong></p>
                      <p>Account No: <strong className="font-mono">{printInvoiceData.business.bank_account_no}</strong></p>
                      <p>IFSC Code: <strong className="font-mono">{printInvoiceData.business.bank_ifsc}</strong></p>
                      {printInvoiceData.business.bank_branch && <p>Branch: {printInvoiceData.business.bank_branch}</p>}
                    </>
                  ) : (
                    <p className="text-slate-500 italic">No bank details added in profile.</p>
                  )}
                  {printInvoiceData.business?.upi_id && (
                    <p className="pt-1 border-t border-slate-200 mt-1">
                      UPI ID (VPA): <strong className="font-mono text-indigo-700">{printInvoiceData.business.upi_id}</strong>
                    </p>
                  )}
                </div>

                {/* Right: Calculations Table */}
                <div className="border border-slate-300 rounded p-3 space-y-1 text-right">
                  <div className="flex justify-between py-0.5">
                    <span className="text-slate-600">Subtotal (Taxable Amount):</span>
                    <span className="font-mono font-bold">₹{parseFloat(printInvoiceData.invoice?.subtotal || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</span>
                  </div>
                  {parseFloat(printInvoiceData.invoice?.cgst_amount || 0) > 0 && (
                    <div className="flex justify-between py-0.5">
                      <span className="text-slate-600">Central GST (CGST):</span>
                      <span className="font-mono">₹{parseFloat(printInvoiceData.invoice?.cgst_amount || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</span>
                    </div>
                  )}
                  {parseFloat(printInvoiceData.invoice?.sgst_amount || 0) > 0 && (
                    <div className="flex justify-between py-0.5">
                      <span className="text-slate-600">State GST (SGST):</span>
                      <span className="font-mono">₹{parseFloat(printInvoiceData.invoice?.sgst_amount || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</span>
                    </div>
                  )}
                  {parseFloat(printInvoiceData.invoice?.igst_amount || 0) > 0 && (
                    <div className="flex justify-between py-0.5">
                      <span className="text-slate-600">Integrated GST (IGST):</span>
                      <span className="font-mono">₹{parseFloat(printInvoiceData.invoice?.igst_amount || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</span>
                    </div>
                  )}
                  <div className="flex justify-between py-1.5 border-t-2 border-slate-900 text-sm font-black text-slate-900">
                    <span>Grand Total Due:</span>
                    <span className="font-mono">₹{parseFloat(printInvoiceData.invoice?.total_amount || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</span>
                  </div>
                  <div className="text-[10px] text-slate-600 italic text-left pt-1 border-t border-slate-200">
                    Amount in words: <strong className="not-italic text-slate-900">{numberToIndianWords(parseFloat(printInvoiceData.invoice?.total_amount || 0))}</strong>
                  </div>
                </div>
              </div>

              {/* Terms & Conditions + Signatory */}
              <div className="grid grid-cols-2 gap-4 pt-4 border-t border-slate-300 text-xs">
                <div className="space-y-1">
                  <span className="font-bold text-[10px] uppercase tracking-wider text-slate-700">Terms & Conditions:</span>
                  <p className="text-[11px] text-slate-600 whitespace-pre-line leading-relaxed">
                    {printInvoiceData.invoice?.terms || printInvoiceData.business?.invoice_terms || "1. Payment is due within 15 days.\n2. Overdue bills attract 18% p.a. interest.\n3. Subject to local jurisdiction."}
                  </p>
                </div>

                <div className="flex flex-col items-end justify-between h-28 text-right">
                  <span className="font-bold text-xs text-slate-900">
                    {printInvoiceData.business?.business_name}
                  </span>
                  <div className="border-t border-slate-900 pt-1 w-48 text-center text-[10px] text-slate-700">
                    {printInvoiceData.business?.signature_title || 'Authorized Signatory'}
                  </div>
                </div>
              </div>

            </div>
          </div>
        </div>
      )}

    </div>
  );
}

    // ========================================================================
    // COMPONENT: SubscriptionModal (Subscription Plans & Quota Management)
    // ========================================================================
    function SubscriptionModal({ isOpen, onClose, token, user, onSubscriptionUpdated, initialAlert }) {
      const [plans, setPlans] = useState([]);
      const [mySub, setMySub] = useState(null);
      const [loading, setLoading] = useState(true);
      const [billingCycle, setBillingCycle] = useState('monthly');
      const [selectedPlanSlug, setSelectedPlanSlug] = useState('starter');
      const [couponCode, setCouponCode] = useState('WELCOME50');
      const [appliedCoupon, setAppliedCoupon] = useState(null);
      const [couponError, setCouponError] = useState(null);
      const [validatingCoupon, setValidatingCoupon] = useState(false);
      const [upgradingSlug, setUpgradingSlug] = useState(null);
      const [upgradeSuccess, setUpgradeSuccess] = useState(null);
      const [error, setError] = useState(null);

      useEffect(() => {
        if (isOpen && token) {
          fetchSubscriptionData();
        }
      }, [isOpen, token]);

      const fetchSubscriptionData = async () => {
        setLoading(true);
        setError(null);
        try {
          const [plansRes, myRes] = await Promise.all([
            fetch(`${API_BASE}/subscriptions/plans`),
            fetch(`${API_BASE}/subscriptions/my`, {
              headers: { 'Authorization': `Bearer ${token}` }
            })
          ]);
          const plansData = await plansRes.json();
          const myData = await myRes.json();

          if (plansData.success) {
            setPlans(plansData.plans || []);
          }
          if (myData.success) {
            setMySub(myData);
            const curSlug = myData.subscription?.plan_slug;
            if (curSlug === 'free') setSelectedPlanSlug('starter');
            else if (curSlug === 'starter') setSelectedPlanSlug('pro');
            else if (curSlug === 'pro') setSelectedPlanSlug('enterprise');
            else setSelectedPlanSlug('enterprise');
          }
        } catch (err) {
          setError('Failed to load subscription details: ' + err.message);
        } finally {
          setLoading(false);
        }
      };

      const handleValidateCoupon = async (targetSlug) => {
        const slug = targetSlug || selectedPlanSlug;
        if (!couponCode.trim()) {
          setCouponError('Please enter a coupon code.');
          return;
        }
        setValidatingCoupon(true);
        setCouponError(null);
        try {
          const res = await fetch(`${API_BASE}/subscriptions/validate-coupon`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({
              code: couponCode.trim(),
              plan_slug: slug,
              billing_cycle: billingCycle
            })
          });
          const data = await res.json();
          if (data.success && data.coupon) {
            setAppliedCoupon(data.coupon);
          } else {
            setCouponError(data.error || 'Invalid or expired coupon code.');
            setAppliedCoupon(null);
          }
        } catch (err) {
          setCouponError(err.message);
          setAppliedCoupon(null);
        } finally {
          setValidatingCoupon(false);
        }
      };

      const handleUpgrade = async (targetSlug) => {
        setUpgradingSlug(targetSlug);
        setError(null);
        setUpgradeSuccess(null);
        try {
          const res = await fetch(`${API_BASE}/subscriptions/upgrade`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({
              plan_slug: targetSlug,
              billing_cycle: billingCycle,
              coupon_code: appliedCoupon ? appliedCoupon.code : couponCode.trim()
            })
          });
          const data = await res.json();
          if (!res.ok || !data.success) {
            throw new Error(data.error || 'Subscription upgrade failed.');
          }
          setUpgradeSuccess(data.message || `Successfully updated plan!`);
          await fetchSubscriptionData();
          if (onSubscriptionUpdated) {
            onSubscriptionUpdated(data.plan);
          }
        } catch (err) {
          setError(err.message);
        } finally {
          setUpgradingSlug(null);
        }
      };

      if (!isOpen) return null;

      const currentSlug = mySub?.subscription?.plan_slug || 'free';
      const isUnlimited = mySub?.subscription?.is_unlimited || false;
      const usage = mySub?.usage || { transactions_count: 0, invoices_count: 0, ai_queries_count: 0 };
      const limits = mySub?.limits || { max_transactions: 15, max_invoices: 5, max_ai_queries: 10, transactions_remaining: 15, invoices_remaining: 5, ai_queries_remaining: 10 };

      const getPlanPrice = (plan) => {
        const base = billingCycle === 'annual' ? parseFloat(plan.price_annual) : parseFloat(plan.price_monthly);
        if (appliedCoupon && selectedPlanSlug === plan.slug) {
          return {
            base,
            final: appliedCoupon.final_price,
            discount: appliedCoupon.discount_amount
          };
        }
        return { base, final: base, discount: 0 };
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-5 bg-black/80 backdrop-blur-sm overflow-y-auto">
          <div className="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-5xl max-h-[94vh] flex flex-col shadow-2xl overflow-hidden animate-fadeIn">
            
            {/* Modal Header */}
            <div className="px-6 py-4 border-b border-slate-800 flex items-center justify-between bg-slate-950/80">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-amber-500 to-indigo-600 flex items-center justify-center text-white text-xl shadow-lg shadow-indigo-500/20">
                  💎
                </div>
                <div>
                  <h3 className="text-base font-extrabold text-white flex items-center gap-2">
                    <span>Subscription Plans & Usage Allowances</span>
                    <span className="text-[10px] px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 font-bold border border-indigo-500/30">
                      Tier: {mySub?.subscription?.plan_name || 'Free Starter'}
                    </span>
                  </h3>
                  <p className="text-xs text-slate-400">
                    Free plan allows experiencing all software features. Upgrade anytime for higher volume.
                  </p>
                </div>
              </div>
              <button
                onClick={onClose}
                className="w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center transition"
              >
                ✕
              </button>
            </div>

            {/* Modal Body */}
            <div className="p-6 overflow-y-auto space-y-6 flex-1">
              
              {/* Limit Alert if provided */}
              {(initialAlert || limits.is_transaction_limit_reached || limits.is_invoice_limit_reached || limits.is_ai_limit_reached) && (
                <div className="p-4 bg-amber-500/10 border border-amber-500/30 rounded-2xl flex items-start gap-3 text-amber-200">
                  <span className="text-xl">⚠️</span>
                  <div>
                    <h4 className="font-bold text-xs uppercase tracking-wide">Usage Limit Reached</h4>
                    <p className="text-xs text-amber-200/90 mt-0.5">
                      {initialAlert || "You have reached the threshold allowed by your current plan. Upgrade below to immediately resume posting without interruptions."}
                    </p>
                  </div>
                </div>
              )}

              {/* Upgrade Success Notification */}
              {upgradeSuccess && (
                <div className="p-4 bg-emerald-500/10 border border-emerald-500/40 rounded-2xl flex items-center gap-3 text-emerald-300 text-xs font-bold animate-pulse">
                  <span className="text-xl">🎉</span>
                  <span>{upgradeSuccess}</span>
                </div>
              )}

              {/* General Error */}
              {error && (
                <div className="p-3 bg-rose-500/10 border border-rose-500/30 rounded-xl text-xs text-rose-300">
                  {error}
                </div>
              )}

              {/* Current Usage Quota Meters */}
              <div className="bg-slate-950/70 border border-slate-800/80 rounded-2xl p-4 sm:p-5">
                <div className="flex items-center justify-between mb-3">
                  <span className="text-xs font-bold uppercase tracking-wider text-slate-400">
                    Live Entitlement & Usage Monitor
                  </span>
                  <span className="text-[11px] text-slate-500">
                    Active Cycle: <strong className="text-slate-300 font-mono capitalize">{mySub?.subscription?.billing_cycle || 'Monthly'}</strong>
                  </span>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  {/* Transactions */}
                  <div className="bg-slate-900/90 border border-slate-800 p-3.5 rounded-xl space-y-2">
                    <div className="flex justify-between text-xs">
                      <span className="text-slate-400 font-medium">Ledger Transactions</span>
                      <span className="font-mono font-bold text-white">
                        {isUnlimited ? 'Unlimited' : `${usage.transactions_count} / ${limits.max_transactions}`}
                      </span>
                    </div>
                    <div className="w-full bg-slate-950 rounded-full h-2 overflow-hidden border border-slate-800">
                      <div
                        className={`h-full rounded-full transition-all duration-500 ${
                          limits.is_transaction_limit_reached ? 'bg-rose-500' : 'bg-gradient-to-r from-indigo-500 to-purple-500'
                        }`}
                        style={{
                          width: isUnlimited ? '100%' : `${Math.min(100, Math.round((usage.transactions_count / Math.max(1, limits.max_transactions)) * 100))}%`
                        }}
                      />
                    </div>
                    <div className="text-[10px] text-slate-500 text-right">
                      {isUnlimited ? '∞ No limit' : `${limits.transactions_remaining} remaining`}
                    </div>
                  </div>

                  {/* Invoices */}
                  <div className="bg-slate-900/90 border border-slate-800 p-3.5 rounded-xl space-y-2">
                    <div className="flex justify-between text-xs">
                      <span className="text-slate-400 font-medium">GST Tax Invoices</span>
                      <span className="font-mono font-bold text-white">
                        {isUnlimited ? 'Unlimited' : `${usage.invoices_count} / ${limits.max_invoices}`}
                      </span>
                    </div>
                    <div className="w-full bg-slate-950 rounded-full h-2 overflow-hidden border border-slate-800">
                      <div
                        className={`h-full rounded-full transition-all duration-500 ${
                          limits.is_invoice_limit_reached ? 'bg-rose-500' : 'bg-gradient-to-r from-emerald-500 to-teal-500'
                        }`}
                        style={{
                          width: isUnlimited ? '100%' : `${Math.min(100, Math.round((usage.invoices_count / Math.max(1, limits.max_invoices)) * 100))}%`
                        }}
                      />
                    </div>
                    <div className="text-[10px] text-slate-500 text-right">
                      {isUnlimited ? '∞ No limit' : `${limits.invoices_remaining} remaining`}
                    </div>
                  </div>

                  {/* AI Queries */}
                  <div className="bg-slate-900/90 border border-slate-800 p-3.5 rounded-xl space-y-2">
                    <div className="flex justify-between text-xs">
                      <span className="text-slate-400 font-medium">AI Ingestion & Queries</span>
                      <span className="font-mono font-bold text-white">
                        {isUnlimited ? 'Unlimited' : `${usage.ai_queries_count} / ${limits.max_ai_queries}`}
                      </span>
                    </div>
                    <div className="w-full bg-slate-950 rounded-full h-2 overflow-hidden border border-slate-800">
                      <div
                        className={`h-full rounded-full transition-all duration-500 ${
                          limits.is_ai_limit_reached ? 'bg-rose-500' : 'bg-gradient-to-r from-cyan-500 to-blue-500'
                        }`}
                        style={{
                          width: isUnlimited ? '100%' : `${Math.min(100, Math.round((usage.ai_queries_count / Math.max(1, limits.max_ai_queries)) * 100))}%`
                        }}
                      />
                    </div>
                    <div className="text-[10px] text-slate-500 text-right">
                      {isUnlimited ? '∞ No limit' : `${limits.ai_queries_remaining} remaining`}
                    </div>
                  </div>
                </div>
              </div>

              {/* Billing Cycle Switcher */}
              <div className="flex flex-col sm:flex-row items-center justify-between gap-4 pt-2">
                <div>
                  <h4 className="text-sm font-bold text-white">Choose Your Plan</h4>
                  <p className="text-xs text-slate-400">All plans include complete double-entry ledger & financial reports.</p>
                </div>

                <div className="flex items-center gap-2 bg-slate-950 p-1.5 rounded-2xl border border-slate-800 shadow-inner">
                  <button
                    type="button"
                    onClick={() => { setBillingCycle('monthly'); setAppliedCoupon(null); }}
                    className={`px-4 py-1.5 rounded-xl text-xs font-bold transition ${
                      billingCycle === 'monthly' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    Monthly Billing
                  </button>
                  <button
                    type="button"
                    onClick={() => { setBillingCycle('annual'); setAppliedCoupon(null); }}
                    className={`px-4 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 ${
                      billingCycle === 'annual' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    <span>Annual Billing</span>
                    <span className="bg-emerald-500/20 text-emerald-300 text-[10px] px-1.5 py-0.2 rounded font-black border border-emerald-500/30">
                      2 Mo Free
                    </span>
                  </button>
                </div>
              </div>

              {/* Plans Grid */}
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                {plans.map((plan) => {
                  const isCurrent = currentSlug === plan.slug;
                  const isSelected = selectedPlanSlug === plan.slug;
                  const pricing = getPlanPrice(plan);

                  let badgeColor = 'bg-slate-800 text-slate-300';
                  let borderHighlight = 'border-slate-800 hover:border-slate-700';

                  if (plan.slug === 'free') {
                    badgeColor = 'bg-slate-800 text-slate-300';
                  } else if (plan.slug === 'starter') {
                    badgeColor = 'bg-blue-500/20 text-blue-300 border border-blue-500/30';
                  } else if (plan.slug === 'pro') {
                    badgeColor = 'bg-indigo-500/20 text-indigo-300 border border-indigo-500/30';
                    borderHighlight = 'border-indigo-500/50 shadow-indigo-500/10 shadow-lg';
                  } else if (plan.slug === 'enterprise') {
                    badgeColor = 'bg-purple-500/20 text-purple-300 border border-purple-500/30';
                    borderHighlight = 'border-purple-500/50';
                  }

                  return (
                    <div
                      key={plan.id}
                      onClick={() => { setSelectedPlanSlug(plan.slug); setCouponError(null); }}
                      className={`relative flex flex-col justify-between p-5 rounded-2xl bg-slate-950/80 border transition cursor-pointer ${
                        isSelected ? 'ring-2 ring-indigo-500 border-transparent' : borderHighlight
                      }`}
                    >
                      {/* Popular / Active Tag */}
                      {plan.slug === 'pro' && (
                        <div className="absolute -top-3 left-1/2 -translate-x-1/2 bg-gradient-to-r from-indigo-500 to-purple-600 text-white text-[10px] font-black uppercase tracking-wider px-3 py-0.5 rounded-full shadow-md">

                        {/* Header */}
                        <div className="flex items-start justify-between gap-2 mb-2">

                                <span className="text-2xl font-black text-white font-mono">
                                  {pricing.final.toLocaleString('en-IN')}
                                </span>

                                <div className="text-[11px] text-emerald-400 line-through font-mono">
                                  ₹{pricing.base.toLocaleString('en-IN')}
                                </div>
                              )}
                            </div>
                          )}
                          <div className="text-[10px] text-slate-500 mt-0.5">
                            {plan.slug === 'free'
                              ? 'Allow full trial experience'
                              : billingCycle === 'annual'
                              ? `Billed annually (₹${Math.round(pricing.final / 12)}/mo)`
                              : 'Billed monthly'}
                          </div>
                        </div>

                        {/* Volume Limits */}
                        <div className="space-y-1.5 py-2 text-xs border-b border-slate-800/80 mb-3">

                            <span>Transactions:</span>
                            <span className="font-bold text-white font-mono">
                              {plan.max_transactions > 90000 ? 'Unlimited' : plan.max_transactions.toLocaleString()}

                          </div>
                          <div className="flex justify-between text-slate-300">
                            <span>GST Invoices:</span>
                            <span className="font-bold text-white font-mono">
                              {plan.max_invoices > 90000 ? 'Unlimited' : plan.max_invoices.toLocaleString()}
                            </span>
                          </div>
                          <div className="flex justify-between text-slate-300">
                            <span>AI Queries:</span>
                            <span className="font-bold text-white font-mono">
                              {plan.ai_queries_limit > 90000 ? 'Unlimited' : plan.ai_queries_limit.toLocaleString()}
                            </span>
                          </div>
                        </div>

                        {/* Feature List */}
                        <ul className="space-y-2 text-xs text-slate-300 mb-4">
                          {(plan.features || []).map((feat, idx) => (
                            <li key={idx} className="flex items-start gap-2">
                              <span className="text-emerald-400 text-xs font-bold">✓</span>
                              <span className="text-[11px] leading-tight text-slate-300">{feat}</span>
                            </li>
                          ))}
                        </ul>
                      </div>

                      {/* Action Button */}
                      <div className="pt-3">
                        {isCurrent ? (
                          <div className="w-full py-2 px-3 text-center text-xs font-bold rounded-xl bg-slate-800 text-slate-400 border border-slate-700 cursor-default">
                            ✓ Current Active Plan
                          </div>
                        ) : plan.slug === 'free' ? (
                          <div className="w-full py-2 px-3 text-center text-xs font-bold rounded-xl bg-slate-900 text-slate-500 border border-slate-800 cursor-default">
                            Free Trial Tier
                          </div>
                        ) : (
                          <button
                            type="button"
                            disabled={upgradingSlug === plan.slug}
                            onClick={(e) => { e.stopPropagation(); handleUpgrade(plan.slug); }}
                            className={`w-full py-2 px-3 text-center text-xs font-extrabold rounded-xl transition shadow-lg ${
                              plan.slug === 'pro'
                                ? 'bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white shadow-indigo-600/30'
                                : 'bg-slate-800 hover:bg-slate-750 text-white border border-slate-700'
                            }`}
                          >
                            {upgradingSlug === plan.slug ? 'Upgrading...' : `Upgrade to ${plan.name}`}
                          </button>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>

              {/* Coupon Redemption Section */}
              <div className="bg-slate-950/70 border border-slate-800/80 rounded-2xl p-4 sm:p-5 flex flex-col sm:flex-row items-center justify-between gap-4">
                <div className="space-y-0.5">
                  <div className="text-xs font-bold text-white flex items-center gap-2">
                    <span>🎟️ Have a Discount Coupon Code?</span>
                    <span className="text-[10px] text-indigo-400 font-mono">Use code 'WELCOME50' for 50% Off</span>
                  </div>
                  <p className="text-[11px] text-slate-400">
                    Apply promo coupons during upgrade to receive instant reductions on monthly and annual plans.
                  </p>
                </div>

                <div className="flex items-center gap-2 w-full sm:w-auto">
                  <input
                    type="text"
                    value={couponCode}
                    onChange={(e) => { setCouponCode(e.target.value.toUpperCase()); setAppliedCoupon(null); setCouponError(null); }}
                    placeholder="Enter Coupon Code"
                    className="bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-1.5 text-xs text-white uppercase font-mono font-bold tracking-wider outline-none focus:border-indigo-500 w-full sm:w-44"
                  />
                  <button
                    type="button"
                    disabled={validatingCoupon || !couponCode.trim()}
                    onClick={() => handleValidateCoupon(selectedPlanSlug)}
                    className="px-4 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold transition shadow-sm whitespace-nowrap"
                  >
                    {validatingCoupon ? 'Checking...' : 'Apply Coupon'}
                  </button>
                </div>
              </div>

              {appliedCoupon && (
                <div className="p-3 bg-emerald-950/40 border border-emerald-500/40 rounded-xl text-xs flex items-center justify-between text-emerald-300">
                  <span className="font-bold">
                    ✓ Coupon '{appliedCoupon.code}' applied! You save ₹{appliedCoupon.discount_amount.toLocaleString('en-IN')} on {selectedPlanSlug.toUpperCase()}.
                  </span>
                  <span className="font-mono font-black text-white">
                    Final Price: ₹{appliedCoupon.final_price.toLocaleString('en-IN')}
                  </span>
                </div>
              )}

              {couponError && (
                <div className="p-3 bg-rose-950/40 border border-rose-500/40 rounded-xl text-xs text-rose-300">
                  {couponError}
                </div>
              )}

            </div>

            {/* Modal Footer */}
            <div className="px-6 py-3.5 border-t border-slate-800 bg-slate-950/90 flex items-center justify-between text-xs text-slate-400">
              <span className="flex items-center gap-1.5">
                <span>🔒 Secure 256-bit encrypted accounting ledger. Instant activation.</span>
              </span>
              <button
                onClick={onClose}
                className="px-4 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-750 text-slate-200 text-xs font-bold transition"
              >
                Close Window
              </button>
            </div>

          </div>
        </div>
      );
    }

    // ========================================================================
    // COMPONENT: DocumentIngestionView (Smart Document Ingestion & Auto-Bookkeeping)
    // ========================================================================
    function DocumentIngestionView({ token, user, onTransactionsPosted, onSwitchTab, onUpgradeRequired }) {
      const [isDragging, setIsDragging] = useState(false);
      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const [isPosting, setIsPosting] = useState(false);
      const [error, setError] = useState(null);
      const [successResult, setSuccessResult] = useState(null);

      const [documentData, setDocumentData] = useState(null);
      const [transactions, setTransactions] = useState([]);
      const [availableAccounts, setAvailableAccounts] = useState([]);
      const [activeMode, setActiveMode] = useState('upload'); // 'upload' | 'paste' | 'samples'
      const [pastedText, setPastedText] = useState('');
      const [sampleCatalog, setSampleCatalog] = useState([]);

      // Quick Account Creation State inside Ingestion Review
      const [showNewAccModal, setShowNewAccModal] = useState(false);
      const [newAccName, setNewAccName] = useState('');
      const [newAccType, setNewAccType] = useState('expense');
      const [newAccGst, setNewAccGst] = useState(true);
      const [isCreatingAcc, setIsCreatingAcc] = useState(false);

      useEffect(() => {
        // Fetch sample catalog
        fetch(`${API_BASE}/documents/samples`)
          .then(res => res.json())
          .then(data => {
            if (data.success && data.samples) {
              setSampleCatalog(data.samples);
            }
          })
          .catch(() => {});
      }, []);

      const handleFileUpload = async (file) => {
        if (!file) return;
        setIsAnalyzing(true);
        setError(null);
        setSuccessResult(null);

        try {
          const formData = new FormData();
          formData.append('document', file);

          const res = await fetch(`${API_BASE}/documents/analyze`, {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${token}`
            },
            body: formData
          });

          const data = await res.json();
          if (!res.ok || !data.success) {
            if (data.upgrade_required && onUpgradeRequired) {
              onUpgradeRequired(data.error);
            }
            throw new Error(data.error || 'Failed to analyze document.');
          }

          setDocumentData(data);
          setTransactions(data.transactions || []);
          if (data.all_accounts) {
            setAvailableAccounts(data.all_accounts);
          }
        } catch (err) {
          setError(err.message);
        } finally {
          setIsAnalyzing(false);
        }
      };

      const handleSampleLoad = async (sampleType) => {
        setIsAnalyzing(true);
        setError(null);
        setSuccessResult(null);

        try {
          const res = await fetch(`${API_BASE}/documents/analyze`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ sample_type: sampleType })
          });

          const data = await res.json();
          if (!res.ok || !data.success) {
            if (data.upgrade_required && onUpgradeRequired) {
              onUpgradeRequired(data.error);
            }
            throw new Error(data.error || 'Failed to analyze sample document.');
          }

          setDocumentData(data);
          setTransactions(data.transactions || []);
          if (data.all_accounts) {
            setAvailableAccounts(data.all_accounts);
          }
        } catch (err) {
          setError(err.message);
        } finally {
          setIsAnalyzing(false);
        }
      };

      const handlePastedTextAnalyze = async () => {
        const text = pastedText.trim();
        if (!text) {
          setError('Please paste document or invoice text to analyze.');
          return;
        }
        setIsAnalyzing(true);
        setError(null);
        setSuccessResult(null);

        try {
          const res = await fetch(`${API_BASE}/documents/analyze`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({
              file_name: 'pasted_document.txt',
              text: text
            })
          });

          const data = await res.json();
          if (!res.ok || !data.success) {
            if (data.upgrade_required && onUpgradeRequired) {
              onUpgradeRequired(data.error);
            }
            throw new Error(data.error || 'Failed to analyze pasted text.');
          }

          setDocumentData(data);
          setTransactions(data.transactions || []);
          if (data.all_accounts) {
            setAvailableAccounts(data.all_accounts);
          }
        } catch (err) {
          setError(err.message);
        } finally {
          setIsAnalyzing(false);
        }
      };

      const handleUpdateRow = (index, field, value) => {
        setTransactions(prev => {
          const copy = [...prev];
          copy[index] = { ...copy[index], [field]: value };

          // Auto-calculate GST if rate or amount changes
          if (field === 'amount' || field === 'gst_rate' || field === 'is_interstate') {
            const amt = parseFloat(copy[index].amount) || 0;
            const rate = parseFloat(copy[index].gst_rate) || 0;
            copy[index].gst_amount = Math.round((amt * rate) / 100 * 100) / 100;
          }

          // If account selected from dropdown
          if (field === 'account_id') {
            const accId = parseInt(value, 10);
            const found = availableAccounts.find(a => parseInt(a.id, 10) === accId);
            if (found) {
              copy[index].target_account = found;
              copy[index].suggested_account_name = found.name;
              copy[index].account_name = found.name;
              // If account type is revenue, default to credit; if expense/asset, default to debit
              if (found.type === 'revenue') {
                copy[index].type = 'credit';
              } else if (found.type === 'expense' || found.type === 'asset') {
                copy[index].type = 'debit';
              }
            }
          }

          return copy;
        });
      };

      const handleDeleteRow = (index) => {
        setTransactions(prev => prev.filter((_, idx) => idx !== index));
      };

      const handleAddManualRow = () => {
        const today = new Date().toISOString().split('T')[0];
        const defaultAcc = availableAccounts.find(a => a.type === 'expense') || availableAccounts[0];
        setTransactions(prev => [
          ...prev,
          {
            id: 'manual_' + Date.now(),
            date: today,
            description: 'New Transaction Entry',
            type: 'debit',
            amount: 1000.0,
            account_id: defaultAcc ? defaultAcc.id : 0,
            account_name: defaultAcc ? defaultAcc.name : 'Office Expense',
            suggested_account_name: defaultAcc ? defaultAcc.name : 'Office Expense',
            gst_rate: 18,
            gst_amount: 180.0,
            is_interstate: false,
            payment_account_id: 2,
            selected: true,
            confidence_score: 1.0
          }
        ]);
      };

      const handleToggleSelectAll = (checked) => {
        setTransactions(prev => prev.map(t => ({ ...t, selected: checked })));
      };

      const handleBatchPost = async (onlySelected = true) => {
        const toPost = transactions.filter(t => !onlySelected || t.selected);
        if (toPost.length === 0) {
          setError('No transactions selected to post.');
          return;
        }

        setIsPosting(true);
        setError(null);
        setSuccessResult(null);

        try {
          const res = await fetch(`${API_BASE}/documents/batch-post`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({
              items: toPost,
              source_file: documentData?.file_info?.name || 'document'
            })
          });

          const data = await res.json();
          if (!res.ok || !data.success) {
            if (data.upgrade_required && onUpgradeRequired) {
              onUpgradeRequired(data.error);
            }
            throw new Error(data.error || 'Failed to post batch transactions.');
          }

          setSuccessResult(data);
          if (onTransactionsPosted) onTransactionsPosted();

          // Remove posted transactions from candidate list or clear
          if (onlySelected) {
            setTransactions(prev => prev.filter(t => !t.selected));
          } else {
            setTransactions([]);
          }
        } catch (err) {
          setError(err.message);
        } finally {
          setIsPosting(false);
        }
      };

      const handleCreateQuickAccount = async (e) => {
        if (e) e.preventDefault();
        const trimmed = newAccName.trim();
        if (!trimmed) {
          setError('Account name is required.');
          return;
        }
        setIsCreatingAcc(true);
        try {
          const res = await fetch(`${API_BASE}/accounts`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({
              name: trimmed,
              type: newAccType,
              gst_applicable: newAccGst ? 1 : 0
            })
          });
          const data = await res.json();
          if (!res.ok || !data.success) {
            throw new Error(data.error || 'Failed to create account.');
          }
          const created = data.account || data.data;
          setAvailableAccounts(prev => [...prev, created]);
          setShowNewAccModal(false);
          setNewAccName('');
        } catch (err) {
          setError(err.message);
        } finally {
          setIsCreatingAcc(false);
        }
      };

      // Summary Computations
      const selectedTxs = transactions.filter(t => t.selected);
      const selectedDebit = selectedTxs.reduce((sum, t) => sum + (t.type === 'debit' ? parseFloat(t.amount || 0) : 0), 0);
      const selectedCredit = selectedTxs.reduce((sum, t) => sum + (t.type === 'credit' ? parseFloat(t.amount || 0) : 0), 0);
      const selectedGst = selectedTxs.reduce((sum, t) => sum + parseFloat(t.gst_amount || 0), 0);

      const accountsByType = availableAccounts.reduce((acc, item) => {
        const type = item.type || 'other';
        if (!acc[type]) acc[type] = [];
        acc[type].push(item);
        return acc;
      }, {});

      return (
        <div className="space-y-6">
          {/* Header & Hero */}
          <div className="bg-gradient-to-r from-slate-900 via-indigo-950/30 to-slate-900 border border-slate-800/80 rounded-2xl p-6 shadow-xl relative overflow-hidden">
            <div className="absolute -right-10 -bottom-10 w-48 h-48 bg-indigo-500/5 rounded-full blur-3xl pointer-events-none"></div>
            
            <div className="flex flex-col md:flex-row items-start md:items-center justify-between gap-4 relative z-10">
              <div className="space-y-1.5">
                <div className="flex items-center gap-2.5">
                  <div className="w-9 h-9 rounded-xl bg-indigo-500/20 border border-indigo-500/40 flex items-center justify-center text-indigo-300 text-lg font-bold shadow-sm">
                    📁
                  </div>
                  <div>
                    <h2 className="text-lg font-black text-white flex items-center gap-2">
                      <span>Document Ingestion & Multi-Account Posting</span>
                      <span className="text-[10px] px-2 py-0.5 rounded-full bg-gradient-to-r from-indigo-500/20 to-purple-500/20 text-indigo-300 font-extrabold border border-indigo-500/30 uppercase tracking-wider">
                        PDF &bull; DOCX &bull; CSV &bull; XLSX
                      </span>
                    </h2>
                    <p className="text-xs text-slate-400">
                      Upload bank statements, invoices, bills, and payment logs to automatically extract transactions, match necessary ledger accounts, and post balanced double-entry entries.
                    </p>
                  </div>
                </div>
              </div>

              {/* Mode Switcher */}
              <div className="flex bg-slate-950/80 p-1 rounded-xl border border-slate-800 text-xs font-semibold self-stretch md:self-auto">
                <button
                  type="button"
                  onClick={() => setActiveMode('upload')}
                  className={`px-3 py-1.5 rounded-lg transition ${activeMode === 'upload' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}
                >
                  📤 Upload Document
                </button>
                <button
                  type="button"
                  onClick={() => setActiveMode('samples')}
                  className={`px-3 py-1.5 rounded-lg transition ${activeMode === 'samples' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}
                >
                  ⚡ Sample Presets
                </button>
                <button
                  type="button"
                  onClick={() => setActiveMode('paste')}
                  className={`px-3 py-1.5 rounded-lg transition ${activeMode === 'paste' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}
                >
                  📋 Paste Text
                </button>
              </div>
            </div>
          </div>

          {/* Error Banner */}
          {error && (
            <div className="p-4 bg-rose-950/40 border border-rose-500/50 rounded-2xl text-xs text-rose-300 flex items-start justify-between gap-3 shadow-lg animate-fade-in">
              <div className="flex items-start gap-2.5">
                <span className="text-base">⚠️</span>
                <div>
                  <div className="font-bold">Document Ingestion Notice</div>
                  <div className="mt-0.5 text-rose-200/90">{error}</div>
                </div>
              </div>
              <button
                type="button"
                onClick={() => setError(null)}
                className="text-rose-400 hover:text-white font-mono text-sm px-1.5 py-0.5"
              >
                ✕
              </button>
            </div>
          )}

          {/* Success Banner */}
          {successResult && (
            <div className="p-5 bg-gradient-to-r from-emerald-950/40 via-teal-950/30 to-slate-900 border border-emerald-500/40 rounded-2xl shadow-xl flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400 text-xl font-black">
                  ✓
                </div>
                <div>
                  <h4 className="text-sm font-black text-white flex items-center gap-2">
                    <span>{successResult.message || 'Transactions Posted Successfully!'}</span>
                    <span className="text-[10px] px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 font-bold border border-emerald-500/30">
                      Balanced Double-Entry
                    </span>
                  </h4>
                  <p className="text-xs text-slate-300 mt-0.5">
                    Posted <span className="font-bold text-emerald-400">{successResult.posted_count} vouchers</span> &bull; Debits: <span className="font-mono text-rose-300 font-bold">₹{Number(successResult.total_debit || 0).toLocaleString()}</span> &bull; Credits: <span className="font-mono text-emerald-300 font-bold">₹{Number(successResult.total_credit || 0).toLocaleString()}</span>
                  </p>
                </div>
              </div>

              <div className="flex items-center gap-2.5 self-end md:self-auto">
                {onSwitchTab && (
                  <>
                    <button
                      type="button"
                      onClick={() => onSwitchTab('ledger')}
                      className="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-750 text-slate-200 text-xs font-bold transition flex items-center gap-1.5 shadow"
                    >
                      <span>📖 View in Ledger</span>
                    </button>
                    <button
                      type="button"
                      onClick={() => onSwitchTab('reports')}
                      className="px-3 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold transition flex items-center gap-1.5 shadow"
                    >
                      <span>⚖️ Trial Balance</span>
                    </button>
                  </>
                )}
                <button
                  type="button"
                  onClick={() => setSuccessResult(null)}
                  className="px-3 py-1.5 rounded-xl border border-slate-700 hover:border-slate-600 text-slate-300 text-xs font-bold transition"
                >
                  Dismiss
                </button>
              </div>
            </div>
          )}

          {/* Mode 1: Drag-and-Drop File Upload */}
          {activeMode === 'upload' && !documentData && (
            <div
              onDragOver={(e) => { e.preventDefault(); setIsDragging(true); }}
              onDragLeave={() => setIsDragging(false)}
              onDrop={(e) => {
                e.preventDefault();
                setIsDragging(false);
                const file = e.dataTransfer.files[0];
                if (file) handleFileUpload(file);
              }}
              className={`border-2 border-dashed rounded-2xl p-8 sm:p-12 text-center transition duration-200 ${
                isDragging
                  ? 'border-indigo-400 bg-indigo-500/10 scale-[0.99]'
                  : 'border-slate-800 hover:border-indigo-500/50 bg-slate-900/60'
              }`}
